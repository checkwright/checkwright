[package]
name = "checkwright"
version = "0.0.1"
edition = "2021"
description = "Reproducible checks that catch unsupported claims in coding-agent delivery before merge. Checkwright turns classes of claims an agent can make without evidence into failing checks: a task marked done with no recorded test run, a lifecycle stage skipped, a spec or task naming a file the tree does not have. The checks are deterministic and structural: they prove the evidence a claim rests on exists, not that the code is correct."
license = "Apache-2.0"
repository = "https://github.com/checkwright/checkwright"
readme = "README.md"

[lib]
path = "src/lib.rs"
