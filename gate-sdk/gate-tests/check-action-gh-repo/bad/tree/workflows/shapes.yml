name: yaml-shapes

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # A step sequence whose dashes sit at the steps: key's own column is the same
  # sequence as one indented below it, so its gh call is held to the arms.
  flush_steps:
    runs-on: ubuntu-latest
    steps:
    - name: a call in a sequence at the key's column
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh issue list --state open

  # A comment after the block indicator is no part of it: the lines below are
  # still the body, and the call in them is still a call.
  commented_indicator:
    runs-on: ubuntu-latest
    steps:
      - name: a body under a commented indicator
        env:
          GH_TOKEN: ${{ github.token }}
        run: | # the body follows
          gh issue list --state open
