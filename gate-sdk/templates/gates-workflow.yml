# spec: gate-sdk/SPEC.md §templates/gates-workflow.yml — copy-out, fill-ins and scope boundary
name: gates

on:
  push:
    branches: [main]           # set to your default branch (e.g. master)
  pull_request:
    branches: [main]           # set to your default branch (e.g. master)

jobs:
  gates:
    runs-on: ubuntu-latest
    # spec: gate-sdk/SPEC.md §check-action-permissions
    permissions:
      contents: read
    steps:
      # spec: gate-sdk/SPEC.md §templates/gates-workflow.yml — the full history
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # spec: gate-sdk/SPEC.md §lib/gate.sh — gate_native_bin_spelled spells the door
      - name: resolve the gate binary
        run: |
          . gate-sdk/lib/gate.sh
          echo "GATES=$(gate_native_bin_spelled)" >> "$GITHUB_ENV"
      - name: full battery
        run: "$GATES"
      # spec: gate-sdk/SPEC.md §templates/gates-workflow.yml — suites derived, never hand-listed
      - name: fixture suites (derived from */gate-tests)
        run: |
          suites="$("$GATES" --emit fixture-suites)" || exit 2
          rc=0
          while IFS=$'\t' read -r suite tests checks; do
            echo "== $suite =="
            # shellcheck disable=SC2086  # empty checks expands to no arg by design
            "$GATES" --run-gate-tests "$tests" $checks || rc=1
          done <<<"$suites"
          exit $rc
      # spec: gate-sdk/SPEC.md §templates/gates-workflow.yml — add one step here per further runner
