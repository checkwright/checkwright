# The product statement — docs/generated-projections.md §Generated projections and their freshness gates.
# 'key value…'; '#' comments and blanks ignored. Edit here, then run
# bash gate-sdk/bin/run-gates.sh --emit product-statement --write
category Reproducible checks that catch unsupported claims in coding-agent delivery before merge.
summary Checkwright turns classes of claims an agent can make without evidence into failing checks: a task marked done with no recorded test run, a lifecycle stage skipped, a spec or task naming a file the tree does not have. The checks are deterministic and structural: they prove the evidence a claim rests on exists, not that the code is correct.
