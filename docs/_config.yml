title: Checkwright
description: "Reproducible checks that catch unsupported claims in coding-agent delivery before merge. Checkwright turns classes of claims an agent can make without evidence into failing checks: a task marked done with no recorded test run, a lifecycle stage skipped, a spec or task naming a file the tree does not have. The checks are deterministic and structural: they prove the evidence a claim rests on exists, not that the code is correct."
theme: jekyll-theme-primer

# GitHub Pages supports these; declaring them keeps a local build faithful.
# relative-links rewrites in-repo .md references to their built .html;
# optional-front-matter renders the front-matter-less pages through the chrome;
# sitemap writes sitemap.xml and, since the tree has none, robots.txt naming it.
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-sitemap

# Every page renders through the site chrome; search.json opts back out to layout: null.
defaults:
  - scope:
      path: ""
    values:
      layout: default

