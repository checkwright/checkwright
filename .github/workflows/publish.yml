# spec: RELEASING.md §The procedure — Watch the publish workflow:the tag is the only trigger; one pack, each channel a sibling job
# spec: gate-sdk/SPEC.md §Consumer payload — the roster-derived matrix, each digest computed once
# spec: RELEASING.md §The front-door rehearsal — the published release installed on every roster runner, after both channels
name: publish

on:
  push:
    tags:
      - 'v[0-9]*'

permissions: {}

jobs:
  roster:
    # comment-tier-exempt: pinned, not -latest; native/runners.list's header owns which Linux jobs pin
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
      runners: ${{ steps.legs.outputs.runners }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # spec: gate-sdk/SPEC.md §Layout and configuration — GATE_SDK_NATIVE_RUNNERS_FILE, the one runner map
      - name: derive the build legs from the target roster
        id: legs
        run: |
          set -euo pipefail
          source gate-sdk/lib/gate.sh
          legs='[]'
          while IFS= read -r target; do
            host="$(gate_native_runner "$target")" || {
              echo "target '$target' is in the roster with no runner mapping —" >&2
              echo "add one to $(gate_native_runners_file), or drop the target from the roster." >&2
              exit 1
            }
            legs="$(jq -c --arg t "$target" --arg r "$host" \
              '. + [{target: $t, runner: $r}]' <<<"$legs")"
          done < <(gate_native_targets)
          if [ "$legs" = '[]' ]; then
            echo "the target roster resolved to no targets — nothing to build." >&2
            exit 1
          fi
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "build legs: $legs"
          # spec: RELEASING.md §The front-door rehearsal — the seats: each distinct runner the build legs map to
          runners="$(jq -c '[.[].runner] | unique' <<<"$legs")"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"
          echo "front-door seats: $runners"

  build:
    needs: roster
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.roster.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      # spec: gate-sdk/SPEC.md §Consumer payload — the shared bootstrap: a Windows leg checks out LF
      - name: check the tree out with LF line endings
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # spec: gate-sdk/SPEC.md §Consumer payload — the shared bootstrap: the floor a macOS leg needs
      - name: install the bash floor and GNU userland this leg's path needs
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci-macos-floor.sh

      # spec: gate-sdk/SPEC.md §check-crate-arms — the job's first cargo call, the pinned toolchain's fetch
      - uses: ./.github/actions/toolchain

      # spec: gate-sdk/SPEC.md §Consumer payload — one build body with the CI producer, one digest
      - name: build the gate binary for ${{ matrix.target }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/ci-build-artifact.sh "$TARGET" "$RUNNER_TEMP/artifact"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-binary-${{ matrix.target }}
          path: ${{ runner.temp }}/artifact/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  pack:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # spec: installer/SPEC.md §The dependency boundary — the attest step mints through GitHub's OIDC issuer
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gate-binary-*
          path: ${{ runner.temp }}/artifact

      # spec: gate-sdk/SPEC.md §check-crate-arms — the job's first cargo call, the pinned toolchain's fetch
      - uses: ./.github/actions/toolchain

      # spec: installer/SPEC.md §The packer — ROUTE 1: the tooling binary the assemble step dispatches to
      - name: build the gate binary this job's assemble step dispatches to
        run: bash gate-sdk/bin/build-native.sh

      - name: assemble the package from the tagged tree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          # comment-tier-exempt: download-artifact lands one dir per artifact when several match, flat when one does
          source gate-sdk/lib/gate.sh
          art="$RUNNER_TEMP/artifact"
          binary="$(gate_native_bin)"; binary="${binary##*/}"; binary="${binary%.exe}"
          while IFS= read -r target; do
            name="$binary$(gate_exe_suffix "$target")"
            if [ -f "$art/$target/$name" ]; then
              :                                   # already the layout pack reads
            elif [ -f "$art/gate-binary-$target/$name" ]; then
              mv "$art/gate-binary-$target" "$art/$target"
            elif [ -f "$art/$name" ]; then
              mkdir -p "$art/$target"
              mv "$art/$name" "$art/$name.sha256" "$art/$target/"
            else
              echo "no downloaded artifact for target '$target' under $art:" >&2
              ls -R "$art" >&2
              exit 1
            fi
          done < <(gate_native_targets)

          # spec: installer/SPEC.md §The packer — the footprint refusal; scratch and output outside the checkout
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"
          INSTALLER_PACK_TMP_DIR="$RUNNER_TEMP" \
            bash gate-sdk/bin/run-gates.sh --pack-installer \
              --version "$version" --out "$out" --artifacts "$art"

          # spec: RELEASING.md §The procedure — Watch the publish workflow:a stamp that disagrees with the tag is refused
          tarball="$(ls "$out"/*.tgz)"
          packed="$(tar -xzOf "$tarball" package/package.json | jq -r '.version')"
          if [ "$packed" != "$version" ]; then
            echo "packed version '$packed' is not the tag's '$version'" >&2
            exit 1
          fi

          # spec: gate-sdk/SPEC.md §Consumer payload — the digest, computed where the bytes are produced
          ( cd "$out" && sha256sum "$(basename "$tarball")" > "$(basename "$tarball").sha256" )
          echo "packed $(basename "$tarball") at version $packed"

          # spec: gate-sdk/SPEC.md §Consumer payload — one archive per roster target, archived where the roster is held
          stage="$RUNNER_TEMP/release-archives"
          while IFS= read -r target; do
            name="$binary$(gate_exe_suffix "$target")"
            dir="$binary-$version-$target"
            mkdir -p "$stage/$dir"
            cp "$art/$target/$name" "$art/$target/$name.sha256" "$stage/$dir/"
            tar -czf "$out/$dir.tar.gz" -C "$stage" "$dir"
          done < <(gate_native_targets)

          # spec: companion/SPEC.md §Packing the extension — the Spec Kit extension's archive and sidecar, stamped with the tag's version
          bash scripts/ci-pack-extension.sh "$version" "$out"

          bash gate-sdk/bin/run-gates.sh --only check-release-assets -- --dist "$out" "$version"

      # spec: installer/SPEC.md §The dependency boundary — the job that produced the tarball's bytes attests them
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/checkwright-*.tgz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-package
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: pack
    runs-on: ubuntu-24.04
    # spec: RELEASING.md §The procedure — Watch the publish workflow:the npm job waits on its approval environment
    environment: npm-publish
    permissions:
      contents: read
      # comment-tier-exempt: npm mints its provenance attestation through GitHub's OIDC issuer
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-package
          path: dist

      - name: publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is unset on this repository — the publish credential is" >&2
            echo "repository configuration, carried as desired state in the ops runbook." >&2
            exit 1
          fi
          # comment-tier-exempt: npm expands the variable when it reads the file, so the token never lands on disk
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > ~/.npmrc

          tarballs=(dist/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one tarball, got ${#tarballs[@]}" >&2
            exit 1
          fi
          # spec: RELEASING.md §The publish spec
          npm publish --provenance --access public "$PWD/${tarballs[0]}"

  release:
    needs: [build, pack]
    runs-on: ubuntu-24.04
    # spec: RELEASING.md §The procedure — Watch the publish workflow:the primary channel, held behind no approval
    permissions:
      contents: write
      attestations: read
    outputs:
      previous: ${{ steps.attach.outputs.previous }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/posts/
            /docs/CNAME

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-package
          path: dist

      - name: attach the tarball, the gate binaries and their checksums to the Release
        id: attach
        env:
          GH_TOKEN: ${{ github.token }}
          # spec: gate-sdk/SPEC.md §check-action-gh-repo — the sparse checkout carries a remote, but GH_REPO names the target repository explicitly rather than leaning on it
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          # comment-tier-exempt: keep equal to site-health.yml's release-body env, which reds on a drifted body
          RELEASE_NOTE_GLOB: 'docs/posts/*.md'
          RELEASE_NOTE_TAG_KEY: 'release'
          RELEASE_NOTE_URL_PATH: '/posts/{slug}'
        run: |
          set -euo pipefail

          # spec: RELEASING.md §The procedure — Verify the GitHub Release body:exactly one note per tag, resolved before the Release exists
          apex="$(tr -d '[:space:]' < docs/CNAME)"
          if [ -z "$apex" ]; then
            echo "docs/CNAME is empty — cannot derive the release note's URL" >&2
            exit 1
          fi
          matches=()
          shopt -s nullglob
          for f in $RELEASE_NOTE_GLOB; do
            key="$(awk -v key="$RELEASE_NOTE_TAG_KEY" '
              /^---[[:space:]]*$/ { fm++; next }
              fm == 1 && index($0, key ":") == 1 {
                v = substr($0, length(key) + 2); sub(/^[[:space:]]+/, "", v); print v; exit
              }' "$f")"
            if [ "$key" = "$TAG" ]; then matches+=("$f"); fi
          done
          shopt -u nullglob
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "tag $TAG: expected exactly one note under '$RELEASE_NOTE_GLOB' whose '$RELEASE_NOTE_TAG_KEY:' key names it, found ${#matches[@]}: ${matches[*]:-none}" >&2
            exit 1
          fi
          slug="${matches[0]##*/}"; slug="${slug%.md}"
          url="https://$apex${RELEASE_NOTE_URL_PATH//\{slug\}/$slug}"
          body="$RUNNER_TEMP/release-body.md"
          printf '%s\n\n%s\n' \
            'Full release note, including the allowed-red set and every behavior change:' \
            "$url" > "$body"
          echo "release note for $TAG: ${matches[0]} -> $url"

          tarballs=(dist/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one tarball, got ${#tarballs[@]}" >&2
            exit 1
          fi
          name="$(basename "${tarballs[0]}")"
          assets=("dist/$name" "dist/$name.sha256")

          # spec: installer/SPEC.md §The dependency boundary — no Release exists for a tarball that fails its own attestation
          gh attestation verify "dist/$name" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/publish.yml" \
            --source-ref "refs/tags/$TAG"

          # spec: gate-sdk/SPEC.md §Consumer payload — the per-target archives, a digest source outside the payload
          for f in dist/*; do
            case "${f##*/}" in
              "$name"|"$name.sha256") continue ;;
              *)                      assets+=("$f") ;;
            esac
          done
          if [ "${#assets[@]}" -le 2 ]; then
            echo "no per-target gate binary reached the release job:" >&2
            ls -l dist >&2
            exit 1
          fi

          # spec: RELEASING.md §The front-door rehearsal — the release before this one, read before this one is created or edited; empty where none is published
          previous="$(gh release list --exclude-drafts --limit 30 --json tagName,publishedAt \
            | jq -r --arg tag "$TAG" '[.[] | select(.tagName != $tag)] | sort_by(.publishedAt) | last | .tagName // empty')"
          echo "previous=${previous#v}" >> "$GITHUB_OUTPUT"
          echo "release before $TAG: ${previous:-none}"

          # spec: installer/SPEC.md §Versioning — the declared release channel is `preview`, so the Release states that posture; check-release-channel-parity holds the two in agreement
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --prerelease --notes-file "$body"
          else
            existing="$(gh release view "$TAG" --json body --jq '.body')"
            case "$existing" in
              *"$url"*) echo "Release $TAG body already carries $url" ;;
              *)        gh release edit "$TAG" --notes-file "$body" ;;
            esac
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          echo "attached ${#assets[@]} asset(s) to $TAG: ${assets[*]##*/}"

  front-door:
    needs: [roster, release, npm]
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.roster.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    # spec: RELEASING.md §The front-door rehearsal — the job exports no credential to a step
    permissions:
      contents: read
    steps:
      # spec: RELEASING.md §The front-door rehearsal — the driver's two files and nothing else of the tree
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: front-door
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci-front-door.sh
            /scripts/ci-front-door.ps1

      # spec: RELEASING.md §The front-door rehearsal — every driver step runs from a directory outside the checkout
      - name: rehearse the published release from this seat
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.release.outputs.previous }}
        run: bash "$GITHUB_WORKSPACE/front-door/scripts/ci-front-door.sh" "${TAG#v}" "$PREVIOUS"

      - name: rehearse the published release from this seat, on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.release.outputs.previous }}
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'front-door/scripts/ci-front-door.ps1') ($env:TAG -replace '^v', '') "$env:PREVIOUS"
          exit $LASTEXITCODE
