# The installer package's publish channel. A version tag is the only trigger and
# the only version input, so nothing publishes from a laptop and no file carries a
# version to edit — the first publish rides an operator-authorized release under
# RELEASING.md §The procedure.
#
# The job split is load-bearing, not tidiness: `pack` assembles and stamps the
# tarball once and uploads it as the run's artifact, and every delivery channel is
# a sibling job that `needs: pack` and consumes that one artifact. Add a channel as
# a job; never weld a second publish into an existing one, which would give two
# channels two assemblies to disagree about.
#
# `roster` + `build` are a stage ahead of the assembly, not a fourth channel: they
# produce the per-target gate binaries the payload carries. The platform set they
# build is never spelled here — it is read from the target roster
# (gate-sdk/SPEC.md §Consumer payload), so the matrix declaration carries no
# platform literal and widening the roster needs no workflow rewrite.
#
# Each digest is computed exactly once, where its bytes are produced, and moved
# thereafter — a second `sha256sum` on a later job is what lets a published digest
# and an installed digest diverge while both look computed
# (check-gate-substrate-parity assertion F).
#
# Every `uses:` ref is a full 40-hex SHA — check-action-pinning walks this file.
name: publish

on:
  push:
    tags:
      - 'v[0-9]*'

# Read-only by default; each job widens only what it needs.
permissions: {}

jobs:
  roster:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The roster declares platform *support*; this step adds the one thing a
      # build needs and support does not — which runner hosts each target. That
      # mapping is a runner selection, so it may name a platform where the matrix
      # declaration may not, and a target it has no entry for fails the release
      # here rather than building somewhere wrong.
      - name: derive the build legs from the target roster
        id: legs
        run: |
          set -euo pipefail
          source gate-sdk/lib/gate.sh
          declare -A runner=(
            [x86_64-unknown-linux-gnu]=ubuntu-latest
          )
          legs='[]'
          while IFS= read -r target; do
            host="${runner[$target]:-}"
            if [ -z "$host" ]; then
              echo "target '$target' is in the roster with no runner mapping —" >&2
              echo "add one here, or drop the target from the roster." >&2
              exit 1
            fi
            legs="$(jq -c --arg t "$target" --arg r "$host" \
              '. + [{target: $t, runner: $r}]' <<<"$legs")"
          done < <(gate_native_targets)
          if [ "$legs" = '[]' ]; then
            echo "the target roster resolved to no targets — nothing to build." >&2
            exit 1
          fi
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "build legs: $legs"

  build:
    needs: roster
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.roster.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Stays a bash `run:` on the runner's preinstalled cargo (no setup-rust
      # action) to keep the checkout+bash tamper floor .github/workflows/gates.yml
      # states. The crate's dependency set is empty, which is what makes a matrix
      # leg network-free and cheap.
      - name: build the gate binary for ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          source gate-sdk/lib/gate.sh
          crate="$(gate_native_crate)"
          binary="$(gate_native_bin)"
          binary="${binary##*/}"

          rustup target add "$TARGET"
          bash gate-sdk/bin/build-native.sh --target "$TARGET"

          # The one digest computation for this artifact anywhere in the release.
          # Every later hop moves this file; nothing re-derives its contents, so
          # the digest the Release publishes and the digest the installer verifies
          # against cannot diverge. The bare filename inside it is what makes
          # `sha256sum -c` work wherever a reader puts the two files.
          out="$RUNNER_TEMP/artifact/$TARGET"
          mkdir -p "$out"
          cp "$crate/target/$TARGET/release/$binary" "$out/$binary"
          ( cd "$out" && sha256sum "$binary" > "$binary.sha256" )
          echo "built $TARGET: $(cat "$out/$binary.sha256")"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The artifact is named for its target and carries the target directory,
          # so a merged download lands exactly the layout pack-installer.sh reads.
          name: gate-binary-${{ matrix.target }}
          path: ${{ runner.temp }}/artifact/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  pack:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gate-binary-*
          path: ${{ runner.temp }}/artifact

      - name: assemble the package from the tagged tree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          # A `pattern:` download lands each artifact in its own directory when
          # several match and directly in `path:` when exactly one does, so the
          # shape on disk is not something this workflow can assert. The roster
          # is, and pack-installer.sh reads `<artifacts>/<target>/`, so normalize
          # onto that from whichever shape arrived. The unreachable case fails
          # loudly and prints the tree: packing a release with a binary silently
          # missing is the one outcome worse than a red run.
          source gate-sdk/lib/gate.sh
          art="$RUNNER_TEMP/artifact"
          binary="$(gate_native_bin)"; binary="${binary##*/}"
          while IFS= read -r target; do
            if [ -f "$art/$target/$binary" ]; then
              :                                   # already the layout pack reads
            elif [ -f "$art/gate-binary-$target/$binary" ]; then
              mv "$art/gate-binary-$target" "$art/$target"
            elif [ -f "$art/$binary" ]; then
              mkdir -p "$art/$target"
              mv "$art/$binary" "$art/$binary.sha256" "$art/$target/"
            else
              echo "no downloaded artifact for target '$target' under $art:" >&2
              ls -R "$art" >&2
              exit 1
            fi
          done < <(gate_native_targets)

          # The pack step refuses a dirty worktree, so its scratch and its output
          # both live outside the checkout.
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"
          INSTALLER_PACK_TMP_DIR="$RUNNER_TEMP" \
            bash scripts/pack-installer.sh --version "$version" --out "$out" \
              --artifacts "$art"

          # The tag is the whole of the version derivation, so prove the packed
          # artifact carries it rather than trusting that the stamp ran.
          tarball="$(ls "$out"/*.tgz)"
          packed="$(tar -xzOf "$tarball" package/package.json | jq -r '.version')"
          if [ "$packed" != "$version" ]; then
            echo "packed version '$packed' is not the tag's '$version'" >&2
            exit 1
          fi

          # The tarball's digest is computed here, where its bytes are produced,
          # and every later job moves the file rather than re-deriving it. What it
          # proves is bounded and stated on the install page: same origin, same TLS
          # session, so it catches corruption and truncation, never a compromised
          # host.
          ( cd "$out" && sha256sum "$(basename "$tarball")" > "$(basename "$tarball").sha256" )
          echo "packed $(basename "$tarball") at version $packed"

          # The Release's per-target assets are renamed here, in the one job that
          # holds the roster, rather than again in the job that attaches them —
          # duplicating the normalization is how the release job came to carry
          # this same defect unnoticed. Release assets are flat, so each carries
          # its target in the filename; the bare filename inside each sidecar is
          # left alone, because that is the name the file carries in the payload
          # where the machine verification happens, and rewriting it would mint a
          # second spelling of one published fact. A human cross-checks the hex,
          # not the filename.
          while IFS= read -r target; do
            cp "$art/$target/$binary"        "$out/$binary-$target"
            cp "$art/$target/$binary.sha256" "$out/$binary-$target.sha256"
          done < <(gate_native_targets)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-package
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: pack
    runs-on: ubuntu-latest
    # The environment is where the operator attaches approval to the publish;
    # its name and required secret are desired state in the ops runbook.
    environment: npm-publish
    permissions:
      contents: read
      # npm mints its provenance attestation through GitHub's OIDC issuer; without
      # this the publish still lands but carries no attestation, which is the whole
      # of what this channel adds over a hand-uploaded tarball.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-package
          path: dist

      - name: publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is unset on this repository — the publish credential is" >&2
            echo "repository configuration, carried as desired state in the ops runbook." >&2
            exit 1
          fi
          # npm expands the variable when it reads the file, so the token itself
          # never lands on disk.
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > ~/.npmrc

          tarballs=(dist/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one tarball, got ${#tarballs[@]}" >&2
            exit 1
          fi
          # An npm spec containing a slash is read as a GitHub
          # owner/repo shorthand unless it is unambiguously a path.
          npm publish --provenance --access public "$PWD/${tarballs[0]}"

  release:
    needs: [build, pack]
    runs-on: ubuntu-latest
    # The primary delivery channel: the same bytes the npm job publishes, reachable
    # with no Node on the adopter's machine. It carries no `environment:` gate —
    # attaching assets to this repository's own Release is neither irreversible nor
    # external, and gating it would hold the primary channel behind the secondary
    # channel's approval. Its capability story is docs/install.md §Requirements.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-package
          path: dist

      - name: attach the tarball, the gate binaries and their checksums to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          # spec: gate-sdk/SPEC.md §check-action-gh-repo — this job checks out nothing, so GH_REPO is the arm that gives gh a target repository to resolve
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tarballs=(dist/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one tarball, got ${#tarballs[@]}" >&2
            exit 1
          fi
          name="$(basename "${tarballs[0]}")"
          assets=("dist/$name" "dist/$name.sha256")

          # The per-target binaries are published here so the digest an adopter's
          # installer verifies against has a source outside the payload it travels
          # in — a digest shipped only alongside its own artifact certifies nothing.
          # They arrive already renamed for their target: this job checks out
          # nothing, so it holds no roster to normalize an artifact layout against,
          # and pack — which does — is where that happens.
          for f in dist/*; do
            case "${f##*/}" in
              "$name"|"$name.sha256") continue ;;
              *)                      assets+=("$f") ;;
            esac
          done
          if [ "${#assets[@]}" -le 2 ]; then
            echo "no per-target gate binary reached the release job:" >&2
            ls -l dist >&2
            exit 1
          fi

          # Create the Release if the tag has none yet, so the assets are on it from
          # the moment it exists; the operator fills in the body afterwards
          # (RELEASING.md §The procedure step 6).
          # spec: docs/install.md §Versioning — the declared release channel is `preview`, so the Release states that posture; check-release-channel-parity holds the two in agreement
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --prerelease --notes ""
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          echo "attached ${#assets[@]} asset(s) to $TAG: ${assets[*]##*/}"
