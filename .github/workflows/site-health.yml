# spec: site-kit/SPEC.md §templates/site-health.yml — this repo's filled instance
# enforce: class=monitor live docs-site deployment — apex/www/http HTTPS, redirects, cert expiry, release-body note pointers, each published Release's prerelease flag against its own version line, theme highlight-class drift against the tracked snapshot, and the repository About against the product statement
name: site-health

on:
  schedule:
    - cron: '17 6 * * *'   # daily, off the hour to dodge cron congestion
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Inject a synthetic probe failure to exercise the issue path'
        type: boolean
        default: false

# spec: site-kit/SPEC.md §templates/site-health.yml — the permissions block is an allowlist
permissions:
  issues: write
  contents: read

jobs:
  probe:
    # comment-tier-exempt: pinned, not -latest; native/runners.list's header owns which Linux jobs pin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: probe live site
        id: probe
        env:
          ALT_DOMAIN: checkwright.com
          RELEASE_NOTE_GLOB: 'docs/posts/*.md'
          RELEASE_NOTE_TAG_KEY: 'release'
          # spec: RELEASING.md §The procedure — Verify the GitHub Release body: bodies are written to this bare form
          RELEASE_NOTE_URL_PATH: '/posts/{slug}'
          HIGHLIGHT_CSS_PATH: '/assets/css/style.css'
          HIGHLIGHT_TOKENS_FILE: 'scripts/highlight-tokens.list'
          FORCE_FAIL: ${{ inputs.force_fail }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -uo pipefail

          apex="$(tr -d '[:space:]' < docs/CNAME)"
          if [ -z "$apex" ]; then
            echo "docs/CNAME empty — cannot resolve apex host"
            exit 1
          fi
          echo "apex host: $apex"

          # spec: site-kit/SPEC.md §templates/site-health.yml — the resample
          attempts=3
          pause=30
          attempt=1
          while :; do
            failures=()

            code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "https://$apex/")"
            [ "$code" = 200 ] || failures+=("apex https did not answer 200 (got '$code')")

            read -r code loc < <(curl -sS -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' "https://www.$apex/") || true
            case "${code}::${loc}" in
              301::*"//$apex/"*) ;;
              *) failures+=("www did not 301 to apex (got '$code' -> '$loc')") ;;
            esac

            read -r code loc < <(curl -sS -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' "http://$apex/") || true
            case "${code}::${loc}" in
              301::https://*) ;;
              *) failures+=("http did not 301 to https (got '$code' -> '$loc')") ;;
            esac

            read -r code loc < <(curl -sS -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' "https://$ALT_DOMAIN/install.html") || true
            case "${code}::${loc}" in
              301::*"//$apex/install.html"*) ;;
              *) failures+=("$ALT_DOMAIN did not 301 to apex keeping path (got '$code' -> '$loc')") ;;
            esac

            expire="$(curl -sSv -m 20 "https://$apex/" 2>&1 >/dev/null | sed -n 's/^\* *expire date: //p' | head -1)"
            if [ -z "$expire" ]; then
              failures+=("could not read certificate expiry for $apex")
            else
              exp_epoch="$(date -d "$expire" +%s 2>/dev/null)"
              if [ -z "$exp_epoch" ]; then
                failures+=("unparseable certificate expiry for $apex: '$expire'")
              else
                days=$(( (exp_epoch - $(date +%s)) / 86400 ))
                [ "$days" -ge 14 ] || failures+=("certificate for $apex expires in $days day(s) (< 14): $expire")
              fi
            fi

            # spec: site-kit/SPEC.md §templates/site-health.yml — the release-body arm
            notes=()
            shopt -s nullglob
            for f in $RELEASE_NOTE_GLOB; do
              notes+=("$f")
            done
            shopt -u nullglob
            if [ "${#notes[@]}" -eq 0 ]; then
              failures+=("release-note glob matched nothing: '$RELEASE_NOTE_GLOB' — set the RELEASE_NOTE_* env above, or delete this arm")
            fi

            # spec: site-kit/SPEC.md §templates/site-health.yml — the tag list comes from the API, paginated
            tag_err="$(mktemp)"
            tags="$(gh api --paginate 'repos/{owner}/{repo}/tags' --jq '.[].name' 2>"$tag_err")"
            tag_rc=$?
            if [ "$tag_rc" -ne 0 ]; then
              failures+=("could not read the tag list (gh exit $tag_rc): $(tr '\n' ' ' < "$tag_err")")
              tags=""
            fi
            rm -f "$tag_err"
            n_tags="$(grep -c . <<<"$tags")"

            n_found="${#notes[@]}"; n_keyed=0; n_released=0; n_checked=0
            for f in "${notes[@]:-}"; do
              [ -n "$f" ] || continue
              tag="$(awk -v key="$RELEASE_NOTE_TAG_KEY" '
                /^---[[:space:]]*$/ { fm++; next }
                fm == 1 && index($0, key ":") == 1 {
                  v = substr($0, length(key) + 2); sub(/^[[:space:]]+/, "", v); print v; exit
                }' "$f")"
              [ -n "$tag" ] || continue
              n_keyed=$(( n_keyed + 1 ))
              grep -Fxq -- "$tag" <<<"$tags" || continue
              n_released=$(( n_released + 1 ))

              slug="${f##*/}"; slug="${slug%.*}"
              want="https://$apex${RELEASE_NOTE_URL_PATH//\{slug\}/$slug}"

              rel_err="$(mktemp)"
              body="$(gh api "repos/{owner}/{repo}/releases/tags/$tag" --jq '.body // ""' 2>"$rel_err")"
              rel_rc=$?
              if [ "$rel_rc" -ne 0 ]; then
                failures+=("$tag: no readable Release for a tag that exists (gh exit $rel_rc): $(tr '\n' ' ' < "$rel_err")")
                rm -f "$rel_err"
                continue
              fi
              rm -f "$rel_err"
              n_checked=$(( n_checked + 1 ))

              case "$body" in
                *"$want"*) ;;
                *) failures+=("$tag: Release body does not carry the note URL $want") ;;
              esac

              while read -r u; do
                [ -n "$u" ] || continue
                case "$u" in
                  "https://$apex"|"https://$apex/"*|"http://$apex"|"http://$apex/"*) ;;
                  *) continue ;;
                esac
                code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$u")"
                [ "$code" = 200 ] || failures+=("$tag: Release body URL $u did not answer 200 (got '$code')")
              done < <(grep -oE 'https?://[^[:space:]<>"]+' <<<"$body" | sed -E 's/[).,;:!?*]+$//' | sort -u)
            done

            echo "release-body: $n_found note(s) found, $n_keyed keyed '$RELEASE_NOTE_TAG_KEY:', $n_released released of $n_tags remote tag(s), $n_checked checked"

            # spec: installer/SPEC.md §The release channel — invariant C, held here as host state
            rel_list_err="$(mktemp)"
            releases="$(gh api --paginate 'repos/{owner}/{repo}/releases' \
              --jq '.[] | select(.draft | not) | "\(.tag_name)\t\(.prerelease)"' 2>"$rel_list_err")"
            rel_list_rc=$?
            if [ "$rel_list_rc" -ne 0 ]; then
              failures+=("could not read the Release list (gh exit $rel_list_rc): $(tr '\n' ' ' < "$rel_list_err")")
              releases=""
            fi
            rm -f "$rel_list_err"

            n_rel=0
            while IFS=$'\t' read -r rel_tag rel_flag; do
              [ -n "$rel_tag" ] || continue
              n_rel=$(( n_rel + 1 ))
              major="${rel_tag#v}"; major="${major%%.*}"
              case "$major" in
                ''|*[!0-9]*)
                  failures+=("$rel_tag: Release tag does not parse as a version line, so the channel it implies cannot be derived")
                  continue ;;
              esac
              if [ "$major" -eq 0 ]; then want_flag=true; else want_flag=false; fi
              [ "$rel_flag" = "$want_flag" ] || failures+=("$rel_tag: prerelease=$rel_flag, but its version line implies prerelease=$want_flag")
            done <<<"$releases"

            echo "release-channel: $n_rel published Release(s) checked against their own version lines"

            # spec: site-kit/SPEC.md §templates/site-health.yml — the theme-drift arm
            if [ -z "${HIGHLIGHT_CSS_PATH:-}${HIGHLIGHT_TOKENS_FILE:-}" ]; then
              echo "theme-drift: skipped (HIGHLIGHT_CSS_PATH and HIGHLIGHT_TOKENS_FILE unset)"
            elif [ -z "${HIGHLIGHT_CSS_PATH:-}" ] || [ -z "${HIGHLIGHT_TOKENS_FILE:-}" ]; then
              failures+=("theme-drift: set both HIGHLIGHT_CSS_PATH and HIGHLIGHT_TOKENS_FILE, or neither")
            elif [ ! -r "$HIGHLIGHT_TOKENS_FILE" ]; then
              failures+=("theme-drift: snapshot $HIGHLIGHT_TOKENS_FILE is not a readable tracked file")
            else
              css="$(mktemp)"
              css_err="$(mktemp)"
              curl -sS -f -m 20 -o "$css" "https://$apex$HIGHLIGHT_CSS_PATH" 2>"$css_err"
              css_rc=$?
              if [ "$css_rc" -ne 0 ]; then
                failures+=("theme-drift: could not fetch https://$apex$HIGHLIGHT_CSS_PATH (curl exit $css_rc): $(tr '\n' ' ' < "$css_err")")
              else
                extracted="$(tr '\n' ' ' < "$css" | sed -E 's#/\*([^*]|\*+[^*/])*\*+/##g' | awk '
                  BEGIN { RS = "}" }
                  {
                    n = split($0, part, "{")
                    if (n < 2) next
                    if (part[n] !~ /(^|[;[:space:]])(color|background|background-color)[[:space:]]*:/) next
                    print "rule"
                    m = split(part[n - 1], sel, ",")
                    for (i = 1; i <= m; i++) {
                      s = sel[i]
                      gsub(/[[:space:]]+/, " ", s); sub(/^ /, "", s); sub(/ $/, "", s)
                      if (s ~ /^\.highlight \.[A-Za-z0-9_-]+$/) print "class " substr(s, 12)
                    }
                  }')"
                theme="$(sed -n 's/^class //p' <<<"$extracted" | sort -u)"
                snap="$(grep -v '^[[:space:]]*#' "$HIGHLIGHT_TOKENS_FILE" | tr -d '[:blank:]\r' | grep . | sort -u)"
                n_theme="$(grep -c . <<<"$theme")"
                echo "theme-drift: $(wc -c < "$css" | tr -d ' ') byte(s) fetched, $(grep -c '^rule$' <<<"$extracted") colour-bearing rule(s), $n_theme class(es) extracted, $(grep -c . <<<"$snap") in the snapshot"
                if [ "$n_theme" -eq 0 ]; then
                  failures+=("theme-drift: https://$apex$HIGHLIGHT_CSS_PATH yielded zero .highlight classes — the extraction or the theme's structure broke")
                else
                  added="$(comm -23 <(printf '%s\n' "$theme") <(printf '%s\n' "$snap") | paste -sd ' ' -)"
                  removed="$(comm -13 <(printf '%s\n' "$theme") <(printf '%s\n' "$snap") | paste -sd ' ' -)"
                  if [ -n "$added$removed" ]; then
                    [ -z "$added" ] || failures+=("theme-drift: the theme colours class(es) the snapshot lacks: $added")
                    [ -z "$removed" ] || failures+=("theme-drift: the snapshot lists class(es) the theme does not colour: $removed")
                    failures+=("theme-drift: the full new list for $HIGHLIGHT_TOKENS_FILE:"$'\n'"$theme")
                  fi
                fi
              fi
              rm -f "$css" "$css_err"
            fi

            # spec: docs/generated-projections.md §Generated projections and their freshness gates
            about_err="$(mktemp)"
            about="$(gh api 'repos/{owner}/{repo}' --jq '.description // ""' 2>"$about_err")"
            about_rc=$?
            statement="$(jq -r '.description' installer/package.json)"
            jq_rc=$?
            if [ "$about_rc" -ne 0 ]; then
              failures+=("about: could not read the repository About (gh exit $about_rc): $(tr '\n' ' ' < "$about_err")")
              echo "about: not compared (the About read failed)"
            elif [ "$jq_rc" -ne 0 ] || [ -z "$statement" ] || [ "$statement" = null ]; then
              failures+=("about: could not read installer/package.json's description (jq exit $jq_rc)")
              echo "about: not compared (the statement read failed)"
            elif [ "$about" = "$statement" ]; then
              echo "about: compared, the About carries the product statement"
            else
              failures+=("about: the repository About differs from the product statement"$'\n'"  About:     $about"$'\n'"  statement: $statement"$'\n'"  remedy: gh repo edit --description with the statement, under OPS.local.md's account step")
              echo "about: compared, the About differs"
            fi
            rm -f "$about_err"

            [ "${#failures[@]}" -gt 0 ] || break
            [ "$attempt" -lt "$attempts" ] || break
            echo "attempt $attempt of $attempts: ${#failures[@]} probe(s) failed; resampling in ${pause}s"
            printf '  - %s\n' "${failures[@]}"
            attempt=$(( attempt + 1 ))
            sleep "$pause"
          done
          echo "probe set settled on attempt $attempt of $attempts"

          if [ "$FORCE_FAIL" = true ]; then
            failures+=("synthetic failure (force_fail dispatch input)")
          fi

          if [ "${#failures[@]}" -gt 0 ]; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
            {
              echo "report<<PROBE_EOF"
              printf '%s\n' "${failures[@]}"
              echo "PROBE_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "FAILED probe(s):"
            printf '  - %s\n' "${failures[@]}"
          else
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "all probes green"
          fi

      - name: file or clear the site-health issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.probe.outputs.status }}
          REPORT: ${{ steps.probe.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label=site-health
          gh label create "$label" --color b60205 \
            --description "Live-site monitoring probe failure" 2>/dev/null || true

          open_num="$(gh issue list --label "$label" --state open \
            --json number --jq '.[0].number // empty')"
          now="$(date -u +'%Y-%m-%d %H:%MZ')"

          if [ "$STATUS" = fail ]; then
            body="$(printf 'Automated site-health probe failed on %s.\n\nFailed probe(s):\n\n```\n%s\n```\n\nRun log: %s\n' \
              "$now" "$REPORT" "$RUN_URL")"
            if [ -n "$open_num" ]; then
              echo "updating open site-health issue #$open_num"
              gh issue comment "$open_num" --body "$body"
            else
              echo "opening a site-health issue"
              gh issue create --label "$label" \
                --title "Site health: live-site probe failed" --body "$body"
            fi
            exit 1
          fi

          if [ -n "$open_num" ]; then
            echo "recovery: closing site-health issue #$open_num"
            gh issue close "$open_num" \
              --comment "Recovered: all probes green on $now. Run log: $RUN_URL"
          else
            echo "site healthy; no open issue to clear"
          fi
