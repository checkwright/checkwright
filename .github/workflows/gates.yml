        env:
          TARGET: ${{ matrix.target }}
        run: |
          failed="$(tr -d '\r' < "$RUNNER_TEMP/crate-tests.log" | sed -n -E 's/^test (.*) \.\.\. FAILED$/\1/p')"
          count="$(printf '%s' "$failed" | grep -c . || true)"
          first="$(printf '%s\n' "$failed" | head -n 10 | paste -sd ' ' -)"
          echo "::warning title=crate-tests-unix ($TARGET)::$count test(s) FAILED on $TARGET; first ten: ${first:-none, so the run failed outside a test}; the job log carries the rest."

  # spec: installer/SPEC.md §The consumer smoke — the CI legs; derived posture, the producer's upload
  install-smoke-sh-macos:
    needs: [native-artifacts, native-artifacts-roster]
    runs-on: ${{ fromJSON(needs.native-artifacts-roster.outputs.index)['aarch64-apple-darwin'].runner }}
    continue-on-error: ${{ fromJSON(needs.native-artifacts-roster.outputs.index)['aarch64-apple-darwin'].held }}
    # spec: installer/SPEC.md §The consumer smoke — widen a leg's ceiling before narrowing it
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # spec: installer/SPEC.md §The consumer smoke — every leg checks out full history
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # spec: installer/SPEC.md §The consumer smoke — a remedy step runs the page's block verbatim
      - name: install the bash docs/install.md names, and PATH-order it
        shell: bash
        run: |
          set +e
          block="$(awk '
            $0 == "<!-- macos-remedy:end -->" { f = 0 }
            f && NF && $0 !~ /^```/ { print }
            $0 == "<!-- macos-remedy:begin -->" { f = 1 }
          ' docs/install.md)"
          if [ -z "$block" ]; then
            echo "::error::docs/install.md carries no macos-remedy block; this leg performs the page's remedy and has none to perform"
            exit 1
          fi
          printf '== docs/install.md macos-remedy block ==\n%s\n' "$block"
          before="$PATH"
          profile="$HOME/.zprofile"
          kept="$( { wc -c < "$profile"; } 2>/dev/null )"
          kept=$(( ${kept:-0} + 0 ))
          eval "$block"
          echo "block exited $?"
          front="${PATH%"$before"}"
          front="${front%:}"
          IFS=: read -r -a entries <<< "$front"
          i=${#entries[@]}
          while [ "$i" -gt 0 ]; do
            i=$((i - 1))
            echo "${entries[$i]}" >> "$GITHUB_PATH"
          done
          next="$(env -i HOME="$HOME" /bin/zsh -l -c 'command -v bash')"
          want="$(brew --prefix)/bin/bash"
          echo "a fresh login shell resolves bash to: ${next:-<MISSING>}"
          if [ "$next" != "$want" ]; then
            echo "::error::a fresh login shell resolves bash to '${next:-<MISSING>}', not $want — the block did not persist its PATH ordering for the adopter's next terminal"
            exit 1
          fi
          added="$RUNNER_TEMP/zprofile-added"
          tail -c +"$((kept + 1))" "$profile" > "$added" 2>/dev/null
          printf '== what the block appended to %s ==\n' "$profile"
          cat "$added"
          bare="$(env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/zsh -f -c 'command -v bash')"
          if [ "$bare" = "$want" ]; then
            echo "::error::a zsh reading no profile already resolves bash to $want, so the probe below could not tell a missing profile line from a present one"
            exit 1
          fi
          alone="$(env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/zsh -f -c '. "$1"; command -v bash' zsh "$added")"
          echo "the appended lines alone, under no startup file and no Homebrew PATH, resolve bash to: ${alone:-<MISSING>}"
          if [ "$alone" != "$want" ]; then
            echo "::error::what the block appended to $profile resolves bash to '${alone:-<MISSING>}', not $want — the profile line that persists the ordering is missing or wrong"
            exit 1
          fi
          exit 0

      # spec: installer/SPEC.md §The consumer smoke — probe steps report and never fail
      - name: probe the runner
        shell: bash
        run: |
          set +e
          echo "== interpreter =="
          echo "BASH_VERSION=$BASH_VERSION"
          echo "command -v bash: $(command -v bash)"
          uname -a
          sw_vers
          echo "== toolchain, by what PATH actually resolves =="
          for t in bash git jq awk gawk sed grep sort find realpath sha256sum \
                   shasum tar npm node cargo rustc rustup shellcheck ruby brew; do
            printf '%-11s %s\n' "$t" "$(command -v "$t" 2>/dev/null || echo '<MISSING>')"
          done
          echo "== flavours, against the POSIX floor docs/install.md asserts =="
          for t in awk sed sort grep find tar; do
            printf '%-6s %s\n' "$t" "$("$t" --version 2>&1 | head -n1)"
          done
          echo "== rust =="
          rustc -vV
          echo "== git =="
          for k in core.autocrlf core.symlinks core.longpaths core.filemode; do
            printf '%-16s %s\n' "$k" "$(git config --get "$k" || echo '<unset>')"
          done
          echo "-- porcelain on a fresh checkout; empty is what every pack step demands --"
          git status --porcelain | head -n 40
          echo "== scratch =="
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "TMPDIR=${TMPDIR:-<unset>}"
          exit 0

      # spec: installer/SPEC.md §The consumer smoke — the producer's upload, downloaded by pattern
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gate-binary-*
          path: ${{ runner.temp }}/native-artifacts

      # spec: installer/SPEC.md §The consumer smoke — normalized and placed as the tree's own gate binary
      - name: normalize the producer's upload onto the layout pack reads
        shell: bash
        run: |
          set -euo pipefail
          source gate-sdk/lib/gate.sh
          art="$RUNNER_TEMP/native-artifacts"
          binary="$(gate_native_bin)"; binary="${binary##*/}"
          host="$(rustc -vV | awk '/^host:/{print $2}')"
          [[ -n "$host" ]] || { echo "rustc reported no host triple"; exit 2; }
          for d in "$art"/gate-binary-*; do
            [[ -d "$d" ]] || continue
            mv "$d" "$art/${d##*/gate-binary-}"
          done
          ls -lR "$art"
          [[ -f "$art/$host/$binary" && -f "$art/$host/$binary.sha256" ]] || {
            echo "the producer uploaded no complete $host artifact — this leg"
            echo "exercises a release-shaped artifact and has none to exercise."
            exit 1
          }
          dest="$(gate_native_bin)"
          mkdir -p "$(dirname "$dest")"
          cp "$art/$host/$binary" "$dest"
          chmod +x "$dest"
          [[ -x "$dest" ]] || { echo "could not place the producer's $host artifact at $dest"; exit 1; }
          echo "SMOKE_ARTIFACTS=$art" >> "$GITHUB_ENV"

      # spec: installer/SPEC.md §The consumer smoke — each platform leg steers the roster at its host
      - name: install smoke on a macOS host
        shell: bash
        run: |
          set +e
          # spec: installer/SPEC.md §The consumer smoke — the explicit steering is the override branch's witness
          host="$(rustc -vV | awk '/^host:/{print $2}')"
          [[ -n "$host" ]] \
            || { echo "rustc reported no host triple, so the roster cannot be steered"; exit 2; }
          echo "host triple: $host"
          roster="$RUNNER_TEMP/targets.list"
          printf '%s\n' "$host" > "$roster"
          log="$RUNNER_TEMP/installer-smoke-macos.log"
          GATE_SDK_NATIVE_TARGETS_FILE="$roster" INSTALLER_SMOKE_TMP_DIR="$RUNNER_TEMP" \
            INSTALLER_SMOKE_ARTIFACTS_DIR="$SMOKE_ARTIFACTS" \
            bash installer/consumer-smoke/run-smoke.sh 2>&1 | tee "$log"
          rc="${PIPESTATUS[0]}"
          echo "== verdict =="
          echo "installer_smoke on macOS exited $rc"
          echo "This leg's posture is derived from the platform declaration, so what a"
          echo "non-zero does is decided there and not by this text: while $host is"
          echo "joined the leg is binding and a non-zero here fails the workflow."
          echo "A zero here is not a roster join: see this job's header for why."
          exit "$rc"

