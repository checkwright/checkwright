    # Carried from the baseline Linux leg's cousins rather than re-derived: same
    # suite, same cold cargo build, and no arm64 measurement exists yet to narrow
    # against. The macOS sibling's timeout header owns why widening beats
    # narrowing, and it is not restated here.
    timeout-minutes: 45
    permissions:
