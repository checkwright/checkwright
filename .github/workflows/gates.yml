  # `ubuntu-24.04-arm` leg the moment the platform declaration names the triple;
  # this job is the consumer that installs THAT upload on THAT host. Neither
  # exists before the declaration does — the roster job derives both from
  # docs/install.md §Requirements — so a runner mapping alone would have created
  # nothing.
  #
  # **Its posture is DERIVED**, off `native-artifacts-roster`'s per-target index at
  # this leg's own triple, for the reason the Intel macOS sibling's header states
  # in full and this one does not restate. While the declaration holds this triple
  # both this leg and its producer are `continue-on-error`, which is what lets the
