        run: |
          failed="$(tr -d '\r' < "$RUNNER_TEMP/crate-tests.log" | sed -n -E 's/^test (.*) \.\.\. FAILED$/\1/p')"
          count="$(printf '%s' "$failed" | grep -c . || true)"
          first="$(printf '%s\n' "$failed" | head -n 10 | paste -sd ' ' -)"
          echo "::warning title=crate-tests-windows ($TARGET)::$count test(s) FAILED on $TARGET; first ten: ${first:-none, so the run failed outside a test}; the job log carries the rest."

  # spec: gate-sdk/SPEC.md §check-crate-arms — the test half on every other published non-Windows triple
  crate-tests-unix:
    needs: native-artifacts-roster
    if: needs.native-artifacts-roster.outputs.unix_legs != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.native-artifacts-roster.outputs.unix_legs) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.held }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # spec: gate-sdk/SPEC.md §Consumer payload — the shared bootstrap: the floor this job's path executes
      - name: install the bash floor and GNU userland this job's path needs
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci-macos-floor.sh

      # spec: gate-sdk/SPEC.md §check-shellcheck — the registry-coverage tests spawn the pinned analyser
      - name: install the pinned shellcheck release, digest-verified
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64)
              suffix=linux.x86_64
              sha=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 ;;
            Linux/aarch64)
              suffix=linux.aarch64
              sha=12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588 ;;
            Darwin/arm64)
              suffix=darwin.aarch64
              sha=56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79 ;;
            Darwin/x86_64)
              suffix=darwin.x86_64
              sha=3c89db4edcab7cf1c27bff178882e0f6f27f7afdf54e859fa041fca10febe4c6 ;;
            *)
              echo "no pinned shellcheck asset for $(uname -s)/$(uname -m)" >&2
              exit 1 ;;
          esac
          dir="$RUNNER_TEMP/shellcheck"
          asset="shellcheck-$SHELLCHECK_VERSION.$suffix.tar.xz"
          mkdir -p "$dir"
          curl -sSfL --retry 3 -o "$dir/$asset" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd "$dir" && printf '%s  %s\n' "$sha" "$asset" | sha256sum -c - )
          else
            ( cd "$dir" && printf '%s  %s\n' "$sha" "$asset" | shasum -a 256 -c - )
          fi
          tar -xJf "$dir/$asset" -C "$dir"
          echo "$dir/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
          "$dir/shellcheck-$SHELLCHECK_VERSION/shellcheck" --version

      # spec: gate-sdk/SPEC.md §check-crate-arms — the docs gates' gems, in the ruby their bare `ruby` resolves
      - name: install the docs gates' gems
        shell: bash
        run: |
          set -euo pipefail
          gem="$(dirname "$(command -v ruby)")/gem"
          if [ -w "$(ruby -e 'print Gem.dir')" ]; then
            "$gem" install --no-document kramdown-parser-gfm liquid:4.0.4
          else
            sudo "$gem" install --no-document kramdown-parser-gfm liquid:4.0.4
          fi
          ruby -e 'require "kramdown-parser-gfm"; require "liquid"; puts "ruby #{RUBY_VERSION}, liquid #{Liquid::VERSION}"'

      # spec: gate-sdk/SPEC.md §check-crate-arms — the host binary the registry-coverage tests spawn
      - name: build the host gate binary the registry-coverage tests spawn
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          bash gate-sdk/bin/build-native.sh

      - name: run the crate's unit tests for ${{ matrix.target }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          cargo test --release --manifest-path native/Cargo.toml --target "$TARGET" 2>&1 | tee "$RUNNER_TEMP/crate-tests.log"

