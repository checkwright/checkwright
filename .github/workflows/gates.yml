# Filled instance of gate-sdk/templates/gates-workflow.yml — this repo's CI
# backstop. The full battery, then the fixture suites derived from the
# gate-tests dirs on disk (gate_fixture_suites — no hand-list to drift from
# CLAUDE.md's battery), then the non-gate-tests runners. Checkout + bash only.
# Scope + neutrality boundary: see the template header and gate-sdk/SPEC.md
# §Enforcement tiers.
name: gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — check-trajectory-fresh reads the full commit graph.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # This repo registers check-docs-render-fidelity, whose oracle renders each
      # docs page through ruby's kramdown GFM parser (site-kit/SPEC.md
      # §check-docs-render-fidelity). The runner ships ruby but not the gem, so
      # provision it into the system ruby the gate's bare `ruby` resolves. Stays
      # a bash `run:` (no setup-ruby action) to keep the checkout+bash tamper
      # floor; rides this filled instance, not the generic template, because the
      # dependency joins the toolchain only for a consumer that registers the gate.
      - name: render-fidelity gate deps (kramdown GFM parser)
        run: sudo gem install --no-document kramdown-parser-gfm
      # A registry member now dispatches to a compiled subcommand (gate-sdk/SPEC.md
      # §lib/gate.sh), and gate_command is fail-closed on an absent binary — so the
      # release build precedes the battery rather than accompanying it. Stays a bash
      # `run:` on the runner's preinstalled cargo (no setup-rust action) to keep the
      # checkout+bash tamper floor the kramdown step above states.
      - name: build the native gate binary
        run: bash gate-sdk/bin/build-native.sh
      - name: full battery
        run: bash gate-sdk/bin/run-gates.sh
      - name: fixture suites (derived from */gate-tests)
        run: |
          source gate-sdk/lib/gate.sh
          rc=0
          while IFS=$'\t' read -r suite tests checks; do
            echo "== $suite =="
            # shellcheck disable=SC2086  # empty checks expands to no arg by design
            bash gate-sdk/bin/run-gate-tests.sh "$tests" $checks || rc=1
          done < <(gate_fixture_suites)
          exit $rc
      - name: guard-kit decision table
        run: bash guard-kit/bin/run-guard-tests.sh

  # The activation path, exercised server-side. It is a job rather than a step in
  # `gates` because it asserts a different thing — that an adopter's install
  # works, not that this tree is clean — and because the macOS sibling this unit
  # deliberately does not buy will join here as a second job.
  #
  # Not a matrix, and specifically **not derived from native/targets.list**. That
  # roster is the artifact commitment, and a smoke leg on a platform is exactly
  # what has to run *before* that platform may join it (gate-sdk/SPEC.md
  # §Consumer payload). Deriving this matrix from the roster would close the
  # loop: no platform could ever earn the run that qualifies it.
  install-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 — the smoke stamps the packed version from the newest tag
      # (`git describe --tags`), and a shallow checkout carries none, so without
      # it the arm silently exercises the fallback version instead of a real one.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # **This leg is green against a recorded baseline, never green simpliciter,
      # and the distinction is the whole reason it is shaped this way.** The suite
      # exits non-zero today at its binary-less leg on `run-gates: scripts/gates.list
      # names no gates` — a ruled outcome held in .workflow/validate-baseline.txt
      # against `binary-less-dispatch-loop-retirement`, not a defect this leg may
      # clear. So the suite's status is captured rather than obeyed, and the
      # verdict comes from diff-baseline.sh, which reds only where the observed
      # result *deviates* from that record. Reading this step as a plain smoke run
      # would misread both what it asserts and what a red here means.
      #
      # **The honest limit, stated because the shape above oversells itself.** The
      # suite is on the `exit-code` parser, so its whole verdict is one scenario
      # and its baseline row is that scenario at `fail`. Every outcome therefore
      # reads as clean: any non-zero matches the baselined `fail`, and a zero is an
      # unpromoted recovery, which is also not a red. So this leg today proves that
      # the activation path *runs* on a clean checkout and prints its findings into
      # the log above — real coverage, since nothing in CI did even that — and it
      # does **not** yet distinguish the ruled failure from a new one. Closing that
      # needs per-arm scenarios for this suite, which is `validate-baseline-suite-coverage`'s
      # reserved design call rather than this leg's to take. Do not read a green
      # here as the install path being sound; read the log.
      #
      # Stays a bash `run:` on the runner's preinstalled toolchain (no setup-node,
      # no setup-rust) to keep the checkout+bash tamper floor the steps above state.
      - name: install smoke, judged against the recorded baseline
        env:
          INSTALLER_SMOKE_TMP_DIR: ${{ runner.temp }}
        run: |
          log="$RUNNER_TEMP/installer-smoke.log"
          # The suite's own non-zero is an input to the comparison, not a verdict,
          # so -e is lifted across it and the status read from PIPESTATUS — tee's
          # own zero would otherwise be the only status this shell ever sees.
          set +e
          bash installer/consumer-smoke/run-smoke.sh 2>&1 | tee "$log"
          rc="${PIPESTATUS[0]}"
          set -e
          echo "installer_smoke exited $rc; the verdict below is the baseline diff, not that status"
          bash evidence-kit/bin/diff-baseline.sh installer_smoke "$log" "$rc"
