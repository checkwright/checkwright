# Filled instance of gate-sdk/templates/gates-workflow.yml — this repo's CI
# backstop. The full battery, then the fixture suites derived from the
# gate-tests dirs on disk (gate_fixture_suites — no hand-list to drift from
# CLAUDE.md's battery), then the non-gate-tests runners. Checkout + bash only.
# Scope + neutrality boundary: see the template header and gate-sdk/SPEC.md
# §Enforcement tiers.
name: gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 — check-trajectory-fresh reads the full commit graph.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # This repo registers check-docs-render-fidelity, whose oracle renders each
      # docs page through ruby's kramdown GFM parser (site-kit/SPEC.md
      # §check-docs-render-fidelity). The runner ships ruby but not the gem, so
      # provision it into the system ruby the gate's bare `ruby` resolves. Stays
      # a bash `run:` (no setup-ruby action) to keep the checkout+bash tamper
      # floor; rides this filled instance, not the generic template, because the
      # dependency joins the toolchain only for a consumer that registers the gate.
      - name: render-fidelity gate deps (kramdown GFM parser)
        run: sudo gem install --no-document kramdown-parser-gfm
      # A registry member now dispatches to a compiled subcommand (gate-sdk/SPEC.md
      # §lib/gate.sh), and gate_command is fail-closed on an absent binary — so the
      # release build precedes the battery rather than accompanying it. Stays a bash
      # `run:` on the runner's preinstalled cargo (no setup-rust action) to keep the
      # checkout+bash tamper floor the kramdown step above states.
      - name: build the native gate binary
        run: bash gate-sdk/bin/build-native.sh
      # The standing oracle for the crate's whole unix-only class: `cargo check` does
      # not link, so no MSVC linker is needed and a Linux runner can answer whether
      # the crate compiles for Windows; `rustup target add` fetches a precompiled std.
      # The next un-gated `std::os::unix` use reds on the commit that adds it rather
      # than on a Windows adopter's machine. Three limits ship with it. A compiler
      # halts at its first error batch, so a green proves the crate compiles and a red
      # names one batch — never the full set, so this cannot prove absence. It proves
      # compilation, NOT correctness: `proc.rs`'s `PATH` split compiles cleanly for
      # this triple and is wrong there. And it is NOT a gate and must not become one —
      # it needs `rustup` and network, which this repo's contributor floor does not
      # carry (context-kit/SPEC.md §bin/env-probe), and a registry member that cannot
      # run in a contributor's tree reds for the wrong reason. It rides this job, so
      # it costs no additional push and no additional workflow run.
      - name: cross-check the crate compiles for Windows
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --release --manifest-path native/Cargo.toml --target x86_64-pc-windows-msvc
      - name: full battery
        run: bash gate-sdk/bin/run-gates.sh
      - name: fixture suites (derived from */gate-tests)
        run: |
          source gate-sdk/lib/gate.sh
          rc=0
          while IFS=$'\t' read -r suite tests checks; do
            echo "== $suite =="
            # shellcheck disable=SC2086  # empty checks expands to no arg by design
            bash gate-sdk/bin/run-gate-tests.sh "$tests" $checks || rc=1
          done < <(gate_fixture_suites)
          exit $rc
      - name: guard-kit decision table
        run: bash guard-kit/bin/run-guard-tests.sh

  # The activation path, exercised server-side. It is a job rather than a step in
  # `gates` because it asserts a different thing — that an adopter's install
  # works, not that this tree is clean — and because the per-platform siblings
  # join here as further jobs. The native Windows one is below; the macOS one is
  # still owed and belongs to `macos-install-smoke-ci-leg`, which the same-day
  # split moved it to after this comment was written.
  #
  # Not a matrix, and specifically **not derived from native/targets.list**. That
  # roster is the artifact commitment, and a smoke leg on a platform is exactly
  # what has to run *before* that platform may join it (gate-sdk/SPEC.md
  # §Consumer payload). Deriving this matrix from the roster would close the
  # loop: no platform could ever earn the run that qualifies it.
  install-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 — the smoke stamps the packed version from the newest tag
      # (`git describe --tags`), and a shallow checkout carries none, so without
      # it the arm silently exercises the fallback version instead of a real one.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # **This leg is green against a recorded baseline, never green simpliciter,
      # and the distinction is the whole reason it is shaped this way.** The suite
      # exits non-zero today at its binary-less leg on `run-gates: scripts/gates.list
      # names no gates` — a ruled outcome held in .workflow/validate-baseline.txt
      # against `binary-less-dispatch-loop-retirement`, not a defect this leg may
      # clear. So the suite's status is captured rather than obeyed, and the
      # verdict comes from diff-baseline.sh, which reds only where the observed
      # result *deviates* from that record. Reading this step as a plain smoke run
      # would misread both what it asserts and what a red here means.
      #
      # **What a green here does and does not say.** The suite is on a per-arm
      # parser, so each printed arm of the smoke is its own baseline scenario and
      # the diff reds when an arm that is baselined `pass` comes back red *or
      # absent* (evidence-kit/SPEC.md §Baseline manifest). The ruled failure is
      # held on the binary-less arm alone, and the arms behind it are recorded at
      # `ignore` — a non-verdict for arms nobody observed — so an abort that moves
      # earlier reds every arm it skipped. That is the coverage this leg lacked
      # while the whole suite was one `exit-code` scenario, where every outcome
      # read clean and a green meant nothing. Still read the log: a green says the
      # arms the run reached behaved as recorded, not that the install path is
      # sound on a platform this leg does not run.
      #
      # Stays a bash `run:` on the runner's preinstalled toolchain (no setup-node,
      # no setup-rust) to keep the checkout+bash tamper floor the steps above state.
      - name: install smoke, judged against the recorded baseline
        env:
          INSTALLER_SMOKE_TMP_DIR: ${{ runner.temp }}
        run: |
          log="$RUNNER_TEMP/installer-smoke.log"
          # The suite's own non-zero is an input to the comparison, not a verdict,
          # so -e is lifted across it and the status read from PIPESTATUS — tee's
          # own zero would otherwise be the only status this shell ever sees.
          set +e
          bash installer/consumer-smoke/run-smoke.sh 2>&1 | tee "$log"
          rc="${PIPESTATUS[0]}"
          set -e
          echo "installer_smoke exited $rc; the verdict below is the baseline diff, not that status"
          bash evidence-kit/bin/diff-baseline.sh installer_smoke "$log" "$rc"

  # The native Windows sibling, and the first thing this repository has ever run
  # on a non-Linux host. Its product is the log: whether the crate builds and the
  # vendored battery runs under Git for Windows' bash is unmeasured, so this leg
  # is an instrument before it is an assertion and is shaped to answer as many
  # questions per run as one run can carry.
  #
  # **It does not ride the baseline diff the Linux leg above uses, deliberately.**
  # That baseline's `installer_smoke` rows are per-arm and were recorded from a
  # Linux run, so they are a claim about how those arms behave *there*. A second
  # platform that fails differently, judged against the first platform's record,
  # would report deviations that are platform difference rather than regression —
  # the baseline is held-constant per scenario, and one scenario name cannot hold
  # two populations at once.
  #
  # **What still stands between this leg and `native/targets.list`, corrected
  # 2026-08-27 at scope against the tree rather than carried.** gate-sdk/SPEC.md
  # §Consumer payload admits a triple only on a green run that produced *and
  # exercised* the artifact. The two SOURCE facts that once said this leg could
  # not do that at all have both shipped, and are recorded as discharged so a
  # later session does not re-derive them as live:
  #   - `installer/lib/init.sh`'s `target_of_host()` now maps `MINGW*`, `MSYS*`
  #     and `CYGWIN*` on x86_64 to `x86_64-pc-windows-msvc`, so a Windows host
  #     selects the artifact instead of taking the omit-and-declare branch.
  #   - `GATE_SDK_NATIVE_BIN`'s default derives its suffix from
  #     `gate_exe_suffix`, so the knob names the artifact cargo actually emits
  #     inside an installed consumer and not only on this tree.
  # What remains is the run itself: a green one, produced and exercised.
  #
  # **Every `run:` names `shell: bash`.** GitHub's default `run:` shell on a
  # Windows runner is `pwsh`, while check-action-run-shell resolves an absent
  # `shell:` to bash (gate-sdk/SPEC.md §check-action-run-shell) — right for every
  # job above, wrong here. Naming it keeps the runner and the gate agreeing on
  # what this text is.
  install-smoke-windows:
    runs-on: windows-latest
    # The instrument runs to its end and reports; it does not decide this
    # workflow. Drop this line on the run it is first observed green and not
    # before — that same observation is the roster's join condition.
    continue-on-error: true
    # MSYS emulates fork on every process spawn and this suite spawns thousands,
    # so the 272 seconds it takes on a Linux developer machine
    # (installer/README.md §The consumer smoke) is not the number to plan from.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # Before the checkout, so the tree is written with the line endings every
      # gate, digest and `git status --porcelain` comparison in this repository
      # assumes. Git for Windows sets core.autocrlf=true in its system config and
      # --global outranks it.
      - name: check the tree out with LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      # fetch-depth: 0 — the smoke stamps the packed version from `git describe
      # --tags`, for the reason the Linux leg above states.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Reporting only, and it never fails. Every claim this project makes about
      # a non-Linux platform is currently a reading rather than a measurement,
      # and this step is where that stops being true — it is worth more than the
      # suite below on the first run, because a suite that dies at its preflight
      # says nothing about the host and this says it all at once.
      - name: probe the runner
        shell: bash
        run: |
          set +e
          echo "== interpreter =="
          echo "BASH_VERSION=$BASH_VERSION"
          uname -a
          echo "== toolchain, by what PATH actually resolves =="
          for t in bash git jq awk gawk sed grep sort find realpath cygpath \
                   sha256sum tar npm node cargo rustc rustup shellcheck ruby; do
            printf '%-11s %s\n' "$t" "$(command -v "$t" 2>/dev/null || echo '<MISSING>')"
          done
          echo "== flavours, against the GNU-first floor docs/install.md asserts =="
          for t in awk sed sort grep find; do
            printf '%-6s %s\n' "$t" "$("$t" --version 2>&1 | head -n1)"
          done
          echo "== rust =="
          rustc -vV
          echo "== git =="
          for k in core.autocrlf core.symlinks core.longpaths core.filemode; do
            printf '%-16s %s\n' "$k" "$(git config --get "$k" || echo '<unset>')"
          done
          echo "-- porcelain on a fresh checkout; empty is what every pack step demands --"
          git status --porcelain | head -n 40
          echo "== scratch =="
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "cygpath -u  =$(cygpath -u "$RUNNER_TEMP" 2>/dev/null)"
          echo "TMPDIR=${TMPDIR:-<unset>}"
          exit 0

      # Both values every later step needs, derived once here and handed on
      # through the environment file rather than spelled per step. The suffix
      # has ONE owner — `gate_exe_suffix`, which `GATE_SDK_NATIVE_BIN`'s default
      # already applies — so this leg appends none: a hand-written twin beside a
      # derivation double-suffixes the path, which is exactly what it did until
      # 2026-08-27. The scratch base arrives in Windows spelling and everything
      # below is handled by MSYS bash, so it is translated exactly once.
      - name: resolve the host's artifact name and scratch base
        shell: bash
        run: |
          set -uo pipefail
          source gate-sdk/lib/gate.sh
          tmp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          {
            echo "GATE_SDK_NATIVE_BIN=$(gate_native_bin)"
            echo "SMOKE_TMP=$tmp"
          } >> "$GITHUB_ENV"
          echo "artifact name $(gate_native_bin); scratch base $tmp"

      # Reporting only, and it never fails. The suite stops at the first defect
      # it meets, and the questions that actually decide how many round-trips
      # this leg costs sit *behind* that point — each of them otherwise a run to
      # buy on its own, bought here in one and ahead of the suite. None is
      # answerable from a Linux machine, which is why they are probed rather
      # than reasoned about.
      - name: probe the platform behaviours the suite depends on
        shell: bash
        run: |
          set +e
          probe="$(mktemp -d "${SMOKE_TMP:-/tmp}/probe.XXXXXX")"
          echo "== a freshly written shebang script =="
          printf '#!/usr/bin/env bash\necho reached\n' > "$probe/s.sh"
          chmod +x "$probe/s.sh"
          if [[ -x "$probe/s.sh" ]]; then echo "[[ -x ]] holds"; else echo "[[ -x ]] FAILS after chmod +x"; fi
          "$probe/s.sh" || echo "direct execution FAILS — only 'bash <file>' reaches it here"
          echo "== npm's bin shim, which is how the smoke reaches checkwright =="
          mkdir -p "$probe/pkg" "$probe/host"
          printf '#!/usr/bin/env bash\necho shim-reached\n' > "$probe/pkg/cli.sh"
          chmod +x "$probe/pkg/cli.sh"
          printf '{"name":"probe-cli","version":"1.0.0","bin":{"probe-cli":"cli.sh"}}\n' > "$probe/pkg/package.json"
          printf '{"name":"probe-host","version":"1.0.0","private":true}\n' > "$probe/host/package.json"
          ( cd "$probe/host" && npm install --no-audit --no-fund --loglevel=error "$probe/pkg" )
          ls -l "$probe/host/node_modules/.bin/" 2>&1 | head -n 10
          shim="$probe/host/node_modules/.bin/probe-cli"
          if [[ -x "$shim" ]]; then echo "[[ -x ]] holds on the shim"; else echo "[[ -x ]] FAILS on the shim"; fi
          "$shim" || echo "the shim would not execute — installer/bin/checkwright.sh is unreachable this way"
          echo "== the tracked symlink the payload carries =="
          link="$(git ls-files -s | awk '$1 == "120000" { print $4; exit }')"
          echo "tracked symlink: ${link:-<none>}"
          if [[ -n "$link" ]]; then
            mkdir -p "$probe/arch"
            git archive HEAD -- "$link" | tar -x -C "$probe/arch"
            ls -l "$probe/arch/$link" 2>&1
            if [[ -L "$probe/arch/$link" ]]; then
              echo "survives git archive | tar -x as a symlink"
            else
              echo "materialised as something other than a symlink — the payload's copy differs from the tree's"
            fi
          fi
          echo "== path length, against the 260-char ceiling =="
          deep="$probe"
          for _ in 1 2 3 4 5 6 7 8; do deep="$deep/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"; done
          if mkdir -p "$deep" && printf 'x' > "$deep/f"; then
            echo "wrote a ${#deep} char path"
          else
            echo "FAILED to write a ${#deep} char path"
          fi
          exit 0

      # Reporting only. The crate is where a non-Linux host fails first if it
      # fails at all, and a build that dies inside the suite makes every later
      # step's silence unreadable — so it is probed alone, before the suite that
      # depends on it, and the worktree is re-read afterwards because a release
      # build leaving mode or line-ending churn is what breaks the clean-tree
      # precondition the pack step holds.
      - name: probe the crate build
        shell: bash
        run: |
          set +e
          bash gate-sdk/bin/build-native.sh
          echo "build-native exited $?"
          ls -l native/target/release/ 2>&1 | head -n 20
          echo "-- porcelain after a release build; the smoke asserts this is empty --"
          git status --porcelain | head -n 40
          exit 0

      # The suite itself, under one steering that is **measurement scaffolding
      # and not a fix**: run-smoke.sh blocks unless the target roster is exactly
      # this host, and this host is not the one declared triple. The re-entry is
      # the one installer/README.md §The consumer smoke records — steer this
      # smoke's pack at the host alone while the published payload still commits
      # to what it commits to. pack-installer.sh copies the steered file verbatim
      # into the payload, so the packed roster is this host's and no second copy
      # is read anywhere downstream.
      - name: install smoke on a native Windows host
        shell: bash
        run: |
          set +e
          # Both resolutions are asserted rather than assumed: an instrument that
          # cascades from a silently empty variable reports the wrong defect.
          tmp="${SMOKE_TMP:-}"
          [[ -d "$tmp" ]] \
            || { echo "scratch base did not resolve: RUNNER_TEMP=$RUNNER_TEMP -> $tmp"; exit 2; }
          host="$(rustc -vV | awk '/^host:/{print $2}')"
          [[ -n "$host" ]] \
            || { echo "rustc reported no host triple, so the roster cannot be steered"; exit 2; }
          echo "host triple: $host"
          roster="$tmp/targets.list"
          printf '%s\n' "$host" > "$roster"
          log="$tmp/installer-smoke-windows.log"
          GATE_SDK_NATIVE_TARGETS_FILE="$roster" INSTALLER_SMOKE_TMP_DIR="$tmp" \
            bash installer/consumer-smoke/run-smoke.sh 2>&1 | tee "$log"
          rc="${PIPESTATUS[0]}"
          echo "== verdict =="
          echo "installer_smoke on native Windows exited $rc"
          echo "This leg reports; it does not judge. The log above is the measurement."
          echo "A zero here is not a roster join on its own: gate-sdk/SPEC.md §Consumer payload"
          echo "wants an artifact produced AND exercised, and an omit-and-declare install"
          echo "exercises none. See this job's header for what stands between the two."
          exit "$rc"
