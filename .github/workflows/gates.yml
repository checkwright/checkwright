# Filled instance of gate-sdk/templates/gates-workflow.yml — this repo's CI
# backstop. The full battery, then the fixture suites derived from the
# gate-tests dirs on disk (gate_fixture_suites — no hand-list to drift from
# CLAUDE.md's battery), then the non-gate-tests runners. Checkout + bash only.
# Scope + neutrality boundary: see the template header and gate-sdk/SPEC.md
# §Enforcement tiers.
name: gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 — check-trajectory-fresh reads the full commit graph.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # This repo registers check-docs-render-fidelity, whose oracle renders each
      # docs page through ruby's kramdown GFM parser (site-kit/SPEC.md
      # §check-docs-render-fidelity). The runner ships ruby but not the gem, so
      # provision it into the system ruby the gate's bare `ruby` resolves. Stays
      # a bash `run:` (no setup-ruby action) to keep the checkout+bash tamper
      # floor; rides this filled instance, not the generic template, because the
      # dependency joins the toolchain only for a consumer that registers the gate.
      - name: render-fidelity gate deps (kramdown GFM parser)
        run: sudo gem install --no-document kramdown-parser-gfm
      # A registry member now dispatches to a compiled subcommand (gate-sdk/SPEC.md
      # §lib/gate.sh), and gate_command is fail-closed on an absent binary — so the
      # release build precedes the battery rather than accompanying it. Stays a bash
      # `run:` on the runner's preinstalled cargo (no setup-rust action) to keep the
      # checkout+bash tamper floor the kramdown step above states.
      - name: build the native gate binary
        run: bash gate-sdk/bin/build-native.sh
      # The standing oracle for the crate's whole unix-only class: `cargo check` does
      # not link, so no MSVC linker is needed and a Linux runner can answer whether
      # the crate compiles for Windows; `rustup target add` fetches a precompiled std.
      # The next un-gated `std::os::unix` use reds on the commit that adds it rather
      # than on a Windows adopter's machine. Three limits ship with it. A compiler
      # halts at its first error batch, so a green proves the crate compiles and a red
      # names one batch — never the full set, so this cannot prove absence. It proves
      # compilation, NOT correctness: `proc.rs`'s `PATH` split compiles cleanly for
      # this triple and is wrong there. And it is NOT a gate and must not become one —
      # it needs `rustup` and network, which this repo's contributor floor does not
      # carry (context-kit/SPEC.md §bin/env-probe), and a registry member that cannot
      # run in a contributor's tree reds for the wrong reason. It rides this job, so
      # it costs no additional push and no additional workflow run.
      - name: cross-check the crate compiles for Windows
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --release --manifest-path native/Cargo.toml --target x86_64-pc-windows-msvc
      - name: full battery
        run: bash gate-sdk/bin/run-gates.sh
      - name: fixture suites (derived from */gate-tests)
        run: |
          source gate-sdk/lib/gate.sh
          rc=0
          while IFS=$'\t' read -r suite tests checks; do
            echo "== $suite =="
            # shellcheck disable=SC2086  # empty checks expands to no arg by design
            bash gate-sdk/bin/run-gates.sh --run-gate-tests "$tests" $checks || rc=1
          done < <(gate_fixture_suites)
          exit $rc
      - name: guard-kit decision table
        run: bash gate-sdk/bin/run-gates.sh --run-guard-tests

  # The activation path, exercised server-side. It is a job rather than a step in
  # `gates` because it asserts a different thing — that an adopter's install
  # works, not that this tree is clean — and because the per-platform siblings
  # join here as further jobs. Both are below, and each one's own header says what
  # it asserts rather than this comment: the native Windows leg is an instrument
  # whose product is its log, the macOS leg is binding on its own exit status, and
  # this job is binding against a recorded baseline — three postures, not one.
  # Nothing in tree owes a leg on a fourth platform; one is bought by the entry
  # that wants it, not implied by this group.
  #
  # Not a matrix, and specifically **not derived from native/targets.list**. That
  # roster is the artifact commitment, and a smoke leg on a platform is exactly
  # what has to run *before* that platform may join it (gate-sdk/SPEC.md
  # §Consumer payload). Deriving this matrix from the roster would close the
  # loop: no platform could ever earn the run that qualifies it.
  install-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 — the smoke stamps the packed version from the newest tag
      # (`git describe --tags`), and a shallow checkout carries none, so without
      # it the arm silently exercises the fallback version instead of a real one.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # **This leg is green against a recorded baseline, never green simpliciter,
      # and the distinction is the whole reason it is shaped this way.** The
      # suite's status is captured rather than obeyed, and the verdict comes from
      # --diff-baseline, which reds only where the observed result *deviates* from
      # .workflow/validate-baseline.txt. That shape is not an artifact of the one
      # ruled failure it was built around — the stub cut repaired that arm and
      # every row now records `pass` — it is what lets a ruled outcome be held
      # without a leg that must be remembered to be re-enabled. Reading this step
      # as a plain smoke run would misread both what it asserts and what a red
      # here means.
      #
      # **What a green here does and does not say.** The suite is on a per-arm
      # parser, so each printed arm of the smoke is its own baseline scenario and
      # the diff reds when an arm that is baselined `pass` comes back red *or
      # absent* (evidence-kit/SPEC.md §Baseline manifest). Every arm is baselined
      # `pass`, so an abort anywhere reds not only the arm that failed but every
      # arm it skipped. That is the coverage this leg lacked
      # while the whole suite was one `exit-code` scenario, where every outcome
      # read clean and a green meant nothing. Still read the log: a green says the
      # arms the run reached behaved as recorded, not that the install path is
      # sound on a platform this leg does not run.
      #
      # Stays a bash `run:` on the runner's preinstalled toolchain (no setup-node,
      # no setup-rust) to keep the checkout+bash tamper floor the steps above state.
      - name: install smoke, judged against the recorded baseline
        env:
          INSTALLER_SMOKE_TMP_DIR: ${{ runner.temp }}
        run: |
          log="$RUNNER_TEMP/installer-smoke.log"
          # The suite's own non-zero is an input to the comparison, not a verdict,
          # so -e is lifted across it and the status read from PIPESTATUS — tee's
          # own zero would otherwise be the only status this shell ever sees.
          set +e
          bash installer/consumer-smoke/run-smoke.sh 2>&1 | tee "$log"
          rc="${PIPESTATUS[0]}"
          set -e
          echo "installer_smoke exited $rc; the verdict below is the baseline diff, not that status"
          # The verdict is the bridged `--diff-baseline` arm, and the binary it needs is built by
          # the smoke's OWN first arm above (installer/consumer-smoke/run-smoke.sh, `build (the
          # host gate binary the main payload carries)`) on this runner's preinstalled cargo — not
          # by the `gates` job, which is a separate job with a separate workspace. The residual is
          # named rather than discovered on a watched push: a smoke that blocks BEFORE that arm
          # leaves no binary, and this line then reports the missing binary instead of a per-arm
          # baseline diff. Both are red and the tee'd log above still says which arm broke.
          bash gate-sdk/bin/run-gates.sh --diff-baseline installer_smoke "$log" "$rc"

  # The native Windows sibling, and the first thing this repository has ever run
  # on a non-Linux host. Its product is the log: whether the crate builds and the
  # vendored battery runs under Git for Windows' bash is unmeasured, so this leg
  # is an instrument before it is an assertion and is shaped to answer as many
  # questions per run as one run can carry.
  #
  # **It does not ride the baseline diff the Linux leg above uses, deliberately.**
  # That baseline's `installer_smoke` rows are per-arm and were recorded from a
  # Linux run, so they are a claim about how those arms behave *there*. A second
  # platform that fails differently, judged against the first platform's record,
  # would report deviations that are platform difference rather than regression —
  # the baseline is held-constant per scenario, and one scenario name cannot hold
  # two populations at once.
  #
  # **What still stands between this leg and `native/targets.list`, corrected
  # 2026-08-27 at scope against the tree rather than carried.** gate-sdk/SPEC.md
  # §Consumer payload admits a triple only on a green run that produced *and
  # exercised* the artifact. The three SOURCE facts that once said this leg could
  # not do that at all have all shipped, and are recorded as discharged so a
  # later session does not re-derive them as live:
  #   - `installer/lib/init.sh`'s `target_of_host()` now maps `MINGW*`, `MSYS*`
  #     and `CYGWIN*` on x86_64 to `x86_64-pc-windows-msvc`, so a Windows host
  #     selects the artifact instead of taking the omit-and-declare branch.
  #   - `GATE_SDK_NATIVE_BIN`'s default derives its suffix from
  #     `gate_exe_suffix`, so the knob names the artifact cargo actually emits
  #     inside an installed consumer and not only on this tree.
  #   - `shellcheck`'s bullet in docs/install.md §Requirements justified an
  #     ADOPTER floor member with contributor-only language, so nothing told an
  #     adopter why `init` refuses without it. Round 3 measured that refusal
  #     here; the bullet now states the adopter's own stake and where each
  #     platform takes the member from, and the step above supplies it on this
  #     host. PRODUCED was discharged by that same round — the artifact built
  #     natively and packed — so only EXERCISED is still owed.
  # All three are CONFIRMED discharged by round 4 (run 33068870024): the step
  # below cleared the toolchain and `init` vendored and committed for the first
  # time ever on a Windows host. What remains is NOT merely the run — round 4
  # named a fourth blocker, and this line said "one run" twice before and was
  # wrong both times:
  #   - On MSYS the installed consumer's root is carried in WINDOWS spelling, so
  #     `run-gates.sh`'s RESOLVE_DIRS came out as
  #     `/D:\a\_temp\...\consumer-starter.../gate-sdk/checks` — a POSIX `/` on a
  #     `D:\` path — and all 10 gates reported `unresolved`. The starter profile
  #     vendors gate-sdk alone and its whole shipped roster is `.gate`
  #     descriptors with no shell fallback, so nothing ran at all.
  # gate-sdk/SPEC.md §Consumer payload is explicit that removing a blocker grants
  # nothing, and this leg has now spent three rounds proving that clause the hard
  # way. PRODUCED is discharged; EXERCISED is what is owed, and placing the
  # artifact in a consumer that then invokes zero gates is not exercising it.
  #
  # **Every `run:` names `shell: bash`.** GitHub's default `run:` shell on a
  # Windows runner is `pwsh`, so a step here that omitted the key would run
  # PowerShell over a bash body. check-action-run-shell now *requires* the key on
  # a Windows step rather than assuming bash (gate-sdk/SPEC.md
  # §check-action-run-shell), so the habit this comment used to describe is the
  # mechanism: `shell: bash` selects Git-for-Windows bash and keeps the runner
  # and the gate agreeing on what this text is.
  install-smoke-windows:
    runs-on: windows-latest
    # The instrument runs to its end and reports; it does not decide this
    # workflow. Drop this line on the run it is first observed green and not
    # before — that same observation is the roster's join condition.
    continue-on-error: true
    # MSYS emulates fork on every process spawn and this suite spawns thousands,
    # so the 272 seconds it takes on a Linux developer machine
    # (installer/README.md §The consumer smoke) is not the number to plan from.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # Before the checkout, so the tree is written with the line endings every
      # gate, digest and `git status --porcelain` comparison in this repository
      # assumes. Git for Windows sets core.autocrlf=true in its system config and
      # --global outranks it.
      - name: check the tree out with LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      # fetch-depth: 0 — the smoke stamps the packed version from `git describe
      # --tags`, for the reason the Linux leg above states.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Reporting only, and it never fails. Every claim this project makes about
      # Windows is currently a reading rather than a measurement, and this step is
      # where that stops being true — it is worth more than the suite below on the
      # first run, because a suite that dies at its preflight says nothing about
      # the host and this says it all at once.
      - name: probe the runner
        shell: bash
        run: |
          set +e
          echo "== interpreter =="
          echo "BASH_VERSION=$BASH_VERSION"
          uname -a
          echo "== toolchain, by what PATH actually resolves =="
          for t in bash git jq awk gawk sed grep sort find realpath cygpath \
                   sha256sum tar npm node cargo rustc rustup shellcheck ruby; do
            printf '%-11s %s\n' "$t" "$(command -v "$t" 2>/dev/null || echo '<MISSING>')"
          done
          echo "== flavours, against the GNU-first floor docs/install.md asserts =="
          for t in awk sed sort grep find; do
            printf '%-6s %s\n' "$t" "$("$t" --version 2>&1 | head -n1)"
          done
          echo "== rust =="
          rustc -vV
          echo "== git =="
          for k in core.autocrlf core.symlinks core.longpaths core.filemode; do
            printf '%-16s %s\n' "$k" "$(git config --get "$k" || echo '<unset>')"
          done
          echo "-- porcelain on a fresh checkout; empty is what every pack step demands --"
          git status --porcelain | head -n 40
          echo "== scratch =="
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "cygpath -u  =$(cygpath -u "$RUNNER_TEMP" 2>/dev/null)"
          echo "TMPDIR=${TMPDIR:-<unset>}"
          exit 0

      # Both values every later step needs, derived once here and handed on
      # through the environment file rather than spelled per step. The suffix
      # has ONE owner — `gate_exe_suffix`, which `GATE_SDK_NATIVE_BIN`'s default
      # already applies — so this leg appends none: a hand-written twin beside a
      # derivation double-suffixes the path, which is exactly what it did until
      # 2026-08-27. The scratch base arrives in Windows spelling and everything
      # below is handled by MSYS bash, so it is translated exactly once.
      - name: resolve the host's artifact name and scratch base
        shell: bash
        run: |
          set -uo pipefail
          source gate-sdk/lib/gate.sh
          tmp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          {
            echo "GATE_SDK_NATIVE_BIN=$(gate_native_bin)"
            echo "SMOKE_TMP=$tmp"
          } >> "$GITHUB_ENV"
          echo "artifact name $(gate_native_bin); scratch base $tmp"

      # Reporting only, and it never fails. The suite stops at the first defect
      # it meets, and the questions that actually decide how many round-trips
      # this leg costs sit *behind* that point — each of them otherwise a run to
      # buy on its own, bought here in one and ahead of the suite. None is
      # answerable from a Linux machine, which is why they are probed rather
      # than reasoned about.
      - name: probe the platform behaviours the suite depends on
        shell: bash
        run: |
          set +e
          probe="$(mktemp -d "${SMOKE_TMP:-/tmp}/probe.XXXXXX")"
          echo "== a freshly written shebang script =="
          printf '#!/usr/bin/env bash\necho reached\n' > "$probe/s.sh"
          chmod +x "$probe/s.sh"
          if [[ -x "$probe/s.sh" ]]; then echo "[[ -x ]] holds"; else echo "[[ -x ]] FAILS after chmod +x"; fi
          "$probe/s.sh" || echo "direct execution FAILS — only 'bash <file>' reaches it here"
          echo "== npm's bin shim, which is how the smoke reaches checkwright =="
          mkdir -p "$probe/pkg" "$probe/host"
          printf '#!/usr/bin/env bash\necho shim-reached\n' > "$probe/pkg/cli.sh"
          chmod +x "$probe/pkg/cli.sh"
          printf '{"name":"probe-cli","version":"1.0.0","bin":{"probe-cli":"cli.sh"}}\n' > "$probe/pkg/package.json"
          printf '{"name":"probe-host","version":"1.0.0","private":true}\n' > "$probe/host/package.json"
          ( cd "$probe/host" && npm install --no-audit --no-fund --loglevel=error "$probe/pkg" )
          ls -l "$probe/host/node_modules/.bin/" 2>&1 | head -n 10
          shim="$probe/host/node_modules/.bin/probe-cli"
          if [[ -x "$shim" ]]; then echo "[[ -x ]] holds on the shim"; else echo "[[ -x ]] FAILS on the shim"; fi
          "$shim" || echo "the shim would not execute — installer/bin/checkwright.sh is unreachable this way"
          echo "== the tracked symlink the payload carries =="
          link="$(git ls-files -s | awk '$1 == "120000" { print $4; exit }')"
          echo "tracked symlink: ${link:-<none>}"
          if [[ -n "$link" ]]; then
            mkdir -p "$probe/arch"
            git archive HEAD -- "$link" | tar -x -C "$probe/arch"
            ls -l "$probe/arch/$link" 2>&1
            if [[ -L "$probe/arch/$link" ]]; then
              echo "survives git archive | tar -x as a symlink"
            else
              echo "materialised as something other than a symlink — the payload's copy differs from the tree's"
            fi
          fi
          echo "== path length, against the 260-char ceiling =="
          deep="$probe"
          for _ in 1 2 3 4 5 6 7 8; do deep="$deep/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"; done
          if mkdir -p "$deep" && printf 'x' > "$deep/f"; then
            echo "wrote a ${#deep} char path"
          else
            echo "FAILED to write a ${#deep} char path"
          fi
          exit 0

      # Reporting only. The crate is where a non-Linux host fails first if it
      # fails at all, and a build that dies inside the suite makes every later
      # step's silence unreadable — so it is probed alone, before the suite that
      # depends on it, and the worktree is re-read afterwards because a release
      # build leaving mode or line-ending churn is what breaks the clean-tree
      # precondition the pack step holds.
      - name: probe the crate build
        shell: bash
        run: |
          set +e
          bash gate-sdk/bin/build-native.sh
          echo "build-native exited $?"
          ls -l native/target/release/ 2>&1 | head -n 20
          echo "-- porcelain after a release build; the smoke asserts this is empty --"
          git status --porcelain | head -n 40
          exit 0

      # `shellcheck` is an ADOPTER floor member (docs/install.md §Requirements,
      # context-kit/lib/toolfloor.sh's PROBE_SET, where it carries no audience
      # token) and windows-latest ships without it — so `checkwright init`
      # refuses the toolchain and the suite never reaches the artifact. That is
      # what round 3 measured on 2026-08-27, and it is a real adopter-facing
      # defect rather than a CI one; the repair is the docs half, which now
      # states the adopter's own stake in this member and where each platform
      # takes it from.
      #
      # **This step is measurement scaffolding and not a support claim**, the
      # same class as the roster steering below and declared for the same
      # reason. docs/install.md sends a Windows adopter through WSL, where this
      # member comes from the distribution — and this runner is deliberately
      # NATIVE Windows, because the native path is precisely what is unmeasured.
      # So there is no documented native route to mirror here yet; chocolatey is
      # this host's own package manager, already the source of its `jq`. When a
      # native Windows path is supported, this step's route is what that
      # section has to name, or the leg goes back to measuring nobody's path.
      - name: install the one adopter floor member this runner lacks
        shell: bash
        run: |
          set +e
          choco install shellcheck -y --no-progress
          echo "choco exited $?"
          hash -r
          echo "shellcheck resolves to: $(command -v shellcheck || echo '<MISSING>')"
          shellcheck --version
          # Loud and specific rather than silent: if this did not land, the suite
          # below fails at doctor exactly as it did in round 3, and the next
          # reader must be told which of the two defects they are looking at.
          command -v shellcheck >/dev/null 2>&1 \
            || echo "SCAFFOLDING FAILED — shellcheck is still absent, so a doctor refusal below is THIS step's failure and not a new finding"
          exit 0

      # The suite itself, under one steering that is **measurement scaffolding
      # and not a fix**: run-smoke.sh blocks unless the target roster is exactly
      # this host, and this host is not the one declared triple. The re-entry is
      # the one installer/README.md §The consumer smoke records — steer this
      # smoke's pack at the host alone while the published payload still commits
      # to what it commits to. pack-installer.sh copies the steered file verbatim
      # into the payload, so the packed roster is this host's and no second copy
      # is read anywhere downstream.
      - name: install smoke on a native Windows host
        shell: bash
        run: |
          set +e
          # Both resolutions are asserted rather than assumed: an instrument that
          # cascades from a silently empty variable reports the wrong defect.
          tmp="${SMOKE_TMP:-}"
          [[ -d "$tmp" ]] \
            || { echo "scratch base did not resolve: RUNNER_TEMP=$RUNNER_TEMP -> $tmp"; exit 2; }
          host="$(rustc -vV | awk '/^host:/{print $2}')"
          [[ -n "$host" ]] \
            || { echo "rustc reported no host triple, so the roster cannot be steered"; exit 2; }
          echo "host triple: $host"
          roster="$tmp/targets.list"
          printf '%s\n' "$host" > "$roster"
          log="$tmp/installer-smoke-windows.log"
          GATE_SDK_NATIVE_TARGETS_FILE="$roster" INSTALLER_SMOKE_TMP_DIR="$tmp" \
            bash installer/consumer-smoke/run-smoke.sh 2>&1 | tee "$log"
          rc="${PIPESTATUS[0]}"
          echo "== verdict =="
          echo "installer_smoke on native Windows exited $rc"
          echo "This leg reports; it does not judge. The log above is the measurement."
          echo "A zero here is not a roster join on its own: gate-sdk/SPEC.md §Consumer payload"
          echo "wants an artifact produced AND exercised, and an omit-and-declare install"
          echo "exercises none. See this job's header for what stands between the two."
          exit "$rc"

  # The fourth install-smoke leg, and the second BOOTSTRAP's own. Count these legs
  # by bootstrap and never by platform (installer/README.md §The install boundary):
  # the three above are three platforms driving ONE bootstrap — the Windows one
  # through Git-for-Windows bash — so a reader counting platforms has been reading
  # three legs as covering two halves, which they never did. No other leg
  # substitutes for this one.
  #
  # **What it asserts, and what it deliberately does not.** It asserts the five
  # bootstrap steps that section specifies, each on its own observable, including
  # all three selection outcomes and a real `--install place-artifact` that
  # performs a placement. It does NOT assert that a `checkwright init` completes
  # through PowerShell, and the reason is structural rather than incidental: the
  # binary carries no `init` arm, so step 5's verbatim forwarding would hand `init`
  # to a program that does not implement it. Payload-end-to-end is owed WITH THE
  # RELOCATION and is recorded as owed rather than dropped — read the absence as
  # sequencing, not as an oversight to quietly fill in.
  #
  # **This leg is BINDING, and it was non-binding for exactly one run.** The
  # continue-on-error it carried was argued rather than inherited: the bootstrap
  # this job drives had never executed anywhere, because the repository that
  # authored it has no PowerShell to run it on, so its first run was that code's
  # first run and a binding red would have spent a watched push on the very defect
  # the leg exists to surface. That reason carried its own expiry — drop the line
  # on the first run observed green — and the expiry fired: run `34142337941`
  # concluded this job `success` with all eight checks `ok`, so the line is gone.
  # It is not re-added without a fresh argument; a leg that has run green once is
  # not in the position that bought the exemption.
  #
  # **The setup steps are bash and that is not a breach of the standing "assume no
  # POSIX shell" obligation**, which binds the BOOTSTRAP and not the publisher.
  # Assembling a payload is the packer's job and the packer is bash (§The packer).
  # What must run on a host with no POSIX shell is the step that invokes
  # checkwright.ps1 — and that step is pwsh, reading only the packed tarball.
  install-smoke-powershell:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Before the checkout, for the reason the sibling leg states: every digest
      # comparison below assumes the tree the rest of this repository assumes.
      - name: check the tree out with LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      # fetch-depth: 0 — the pack step stamps its version from `git describe
      # --tags`, and a shallow checkout carries none.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # The same roster steering the Windows leg above takes, for the same reason
      # and with the same standing: MEASUREMENT SCAFFOLDING, NOT A ROSTER WIDENING.
      # It packs a locally built, digest-verified artifact for this host while the
      # published payload still commits only to what native/targets.list declares.
      # This leg performs no join and no surface claims native Windows support on
      # the strength of it.
      - name: build an artifact and pack a payload for this host
        shell: bash
        run: |
          set -uo pipefail
          source gate-sdk/lib/gate.sh
          tmp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          [[ -d "$tmp" ]] || { echo "scratch base did not resolve: $RUNNER_TEMP -> $tmp"; exit 2; }
          host="$(rustc -vV | awk '/^host:/{print $2}')"
          [[ -n "$host" ]] || { echo "rustc reported no host triple, so the roster cannot be steered"; exit 2; }
          echo "host triple: $host"
          crate="$(gate_native_crate)"
          bin="$(gate_native_bin)"; bin="${bin##*/}"
          art="$tmp/artifacts/$host"
          mkdir -p "$art"
          bash gate-sdk/bin/build-native.sh || { echo "the crate would not build on this host"; exit 2; }
          cp "$crate/target/release/$bin" "$art/$bin" || exit 2
          # The sidecar is emitted once, where the bytes are produced; pack
          # re-verifies it and the bootstrap verifies it again before executing.
          ( cd "$art" && sha256sum "$bin" > "$bin.sha256" ) || exit 2
          roster="$tmp/targets.list"
          printf '%s\n' "$host" > "$roster"
          version="$(git describe --tags --abbrev=0 2>/dev/null)"; version="${version#v}"
          [[ -n "$version" ]] || version="0.0.0-pwsh-smoke"
          GATE_SDK_NATIVE_TARGETS_FILE="$roster" INSTALLER_PACK_TMP_DIR="$tmp" \
            bash scripts/pack-installer.sh --root "$PWD" --version "$version" \
              --out "$tmp" --artifacts "$tmp/artifacts" || exit 2
          shopt -s nullglob
          tarballs=("$tmp"/*.tgz)
          shopt -u nullglob
          [[ ${#tarballs[@]} -eq 1 ]] || { echo "expected one tarball, found ${#tarballs[@]}"; exit 2; }
          mkdir -p "$tmp/pkg"
          tar -xzf "${tarballs[0]}" -C "$tmp/pkg" || exit 2
          # Handed on in WINDOWS spelling: everything below this step is pwsh
          # reading real paths, not MSYS bash reading translated ones.
          {
            echo "PWSH_PKG=$(cygpath -w "$tmp/pkg/package")"
            echo "PWSH_SCRATCH=$(cygpath -w "$tmp")"
            echo "PWSH_TARGET=$host"
            echo "PWSH_BIN=$bin"
          } >> "$GITHUB_ENV"

      # The leg proper. Each of the five steps is asserted on an observable that
      # distinguishes IT rather than on the run merely succeeding, because a
      # bootstrap that failed step 2 and one that failed step 4 both exit non-zero.
      # The fixtures are minimal packages — the bootstrap reads bin/ and
      # payload/artifact/ and nothing else, so a kit tree would be cost with no
      # assertion behind it.
      - name: drive the PowerShell bootstrap through its five steps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Pinned on the CALLER too, not only inside the bootstrap: this step is the
          # thing standing in for an adopter's shim, so if it re-quoted the tokens it
          # hands over, the step-5 assertion would never reach the bootstrap intact.
          # The second pin keeps a native non-zero exit a STATUS rather than a thrown
          # exception, which is what lets the refusal assertions read $LASTEXITCODE.
          if (Test-Path Variable:PSNativeCommandArgumentPassing) { $PSNativeCommandArgumentPassing = 'Standard' }
          if (Test-Path Variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          $pkg = $env:PWSH_PKG
          $scratch = $env:PWSH_SCRATCH
          $target = $env:PWSH_TARGET
          $binname = $env:PWSH_BIN
          $script:fails = 0
          function Check([string] $label, [bool] $cond, [string] $detail) {
              if ($cond) { Write-Host "ok   $label" }
              else { Write-Host "BAD  $label -- $detail"; $script:fails++ }
          }
          # A minimal package: the real bootstrap, and an artifact tree the caller
          # may then break in exactly one way.
          function New-Fixture([string] $name) {
              $root = Join-Path $scratch $name
              if (Test-Path $root) { Remove-Item -Recurse -Force $root }
              New-Item -ItemType Directory -Force -Path (Join-Path $root 'bin') | Out-Null
              Copy-Item (Join-Path $pkg 'bin/checkwright.ps1') (Join-Path $root 'bin/checkwright.ps1')
              $src = Join-Path $pkg "payload/artifact"
              $dst = Join-Path $root "payload/artifact"
              New-Item -ItemType Directory -Force -Path $dst | Out-Null
              Copy-Item -Recurse -Force (Join-Path $src '*') $dst
              return $root
          }
          # The call operator and NOT Start-Process. Start-Process joins -ArgumentList
          # into one string and re-quotes it, so the step-5 assertion below would be
          # measuring Start-Process's quoting rather than the bootstrap's forwarding —
          # it could fail on a correct bootstrap, or pass on a broken one. `&` under
          # the Standard passing mode pinned above hands each element across as its
          # own argument, which is the path an adopter's shim actually takes.
          function Invoke-Bootstrap([string] $root, [string[]] $bootArgs) {
              $out = Join-Path $scratch 'out.txt'
              $err = Join-Path $scratch 'err.txt'
              & pwsh -NoProfile -File (Join-Path $root 'bin/checkwright.ps1') @bootArgs 1> $out 2> $err
              return [pscustomobject]@{
                  Code = $LASTEXITCODE
                  Out  = (Get-Content -Raw -LiteralPath $out -ErrorAction SilentlyContinue)
                  Err  = (Get-Content -Raw -LiteralPath $err -ErrorAction SilentlyContinue)
              }
          }

          Write-Host "== the host this leg's step-2 assertion is written against =="
          Check "the runner's own rustc host triple is x86_64-pc-windows-msvc" `
                ($target -eq 'x86_64-pc-windows-msvc') `
                "it is '$target' — step 2's expected answer moved and this assertion must be re-read, not re-greened"

          Write-Host "== step 1: the package's own payload directory =="
          $f = New-Fixture 'fx-nopayload'
          Remove-Item -Recurse -Force (Join-Path $f 'payload')
          $r = Invoke-Bootstrap $f @()
          Check "a package with no payload is named as such" `
                ($r.Code -eq 2 -and $r.Err -match 'carries no payload') "exit $($r.Code): $($r.Err)"

          Write-Host "== step 2 and step 3, outcome 1: a host off the roster omits and declares =="
          $f = New-Fixture 'fx-offroster'
          Set-Content -LiteralPath (Join-Path $f 'payload/artifact/targets.list') -Value 'nosuch-triple-for-any-host'
          $r = Invoke-Bootstrap $f @()
          Check "a triple the roster does not carry is declared substrate-unavailable and proceeds" `
                ($r.Code -eq 0 -and $r.Err -match 'substrate-unavailable') "exit $($r.Code): $($r.Err)"

          Write-Host "== step 3, outcome 3: a declared target with half a pair refuses =="
          $f = New-Fixture 'fx-halfpair'
          Remove-Item -Force (Join-Path $f "payload/artifact/$target/$binname.sha256")
          $r = Invoke-Bootstrap $f @()
          Check "a declared target with no complete artifact refuses, and is not omitted" `
                ($r.Code -eq 1 -and $r.Err -match 'no complete artifact') "exit $($r.Code): $($r.Err)"

          Write-Host "== step 4: the SHA-256 is verified against the sidecar =="
          $f = New-Fixture 'fx-tampered'
          Add-Content -LiteralPath (Join-Path $f "payload/artifact/$target/$binname") -Value 'tamper'
          $r = Invoke-Bootstrap $f @()
          Check "an artifact that does not match its sidecar refuses before executing" `
                ($r.Code -eq 1 -and $r.Err -match 'does not match its published digest') "exit $($r.Code): $($r.Err)"

          Write-Host "== step 5: the verified artifact is executed with argv forwarded verbatim =="
          $f = New-Fixture 'fx-run'
          # A token carrying spaces and a quote, echoed back by the binary's own
          # parse refusal: PowerShell's default binder splits and re-quotes, so a
          # half that forwarded loosely reports 'a' here and not the whole token.
          $r = Invoke-Bootstrap $f @('--install','place-artifact','a b "c"')
          Check "the artifact ran and received the caller's token unaltered" `
                ($r.Code -eq 2 -and $r.Err -match [regex]::Escape("got 'a b ""c""'")) "exit $($r.Code): $($r.Err)"

          $root = Join-Path $scratch 'consumer'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'scripts') | Out-Null
          $src = (Join-Path $f "payload/artifact/$target/$binname")
          $digest = (Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash.ToLowerInvariant()
          # The dest name is DERIVED from the artifact name the setup step resolved,
          # never spelled again here: gate_exe_suffix owns the suffix, and a literal
          # twin beside a derivation is what double-suffixed this repo's other
          # Windows leg until it was found by hand.
          $dest = "scripts/$binname"
          $r = Invoke-Bootstrap $f @('--install','place-artifact','--root',$root,'--src',$src,
                                     '--dest',$dest,
                                     '--seam','scripts/gate-sdk-config.sh',
                                     '--target',$target,'--digest',$digest)
          Check "a real --install place-artifact performs a placement and emits its two verbs" `
                ($r.Code -eq 0 -and $r.Out -match ("own\t" + [regex]::Escape($dest)) -and $r.Out -match 'own\tscripts/gate-sdk-config.sh') `
                "exit $($r.Code): out=$($r.Out) err=$($r.Err)"
          Check "the placement actually wrote the artifact" `
                (Test-Path -LiteralPath (Join-Path $root $dest)) "nothing was written"

          Write-Host "== verdict =="
          Write-Host "This leg asserts the five bootstrap steps. It does NOT assert that a"
          Write-Host "'checkwright init' completes through PowerShell: the binary carries no init"
          Write-Host "arm, so payload-end-to-end is owed with the behind-invoke relocation."
          if ($script:fails -gt 0) { Write-Host "$($script:fails) assertion(s) failed"; exit 1 }
          Write-Host "the PowerShell bootstrap answered all five steps"

  # The RELEASE-SHAPED PRODUCER, and its whole reason for existing is that no leg
  # which builds from the host it runs on can ever discharge a roster join.
  # gate-sdk/SPEC.md §Consumer payload admits a triple to native/targets.list only
  # on a green run that PRODUCED AND EXERCISED its artifact, and it classifies a
  # consumer smoke's host build as a harness stand-in rather than that rule
  # relaxing — so the macOS leg below could go green forever and license nothing.
  # **Ruled by the operator 2026-09-07**, through the lead's question relay in a
  # lead session and lead-relayed: buy a release-shaped producer first. This job
  # is that producer. The build command, the sidecar's format and the directory
  # layout are .github/workflows/publish.yml's build leg's, so what CI exercises
  # is what a release would publish; a job that built the binary a different way
  # would measure a different artifact and discharge nothing.
  #
  # **The matrix is the DECLARATION, not the roster.** It derives from
  # docs/install.md §Requirements' `platforms:begin` block — joined and held
  # platforms alike. Deriving it from native/targets.list would build only what is
  # already joined and measure nothing, which is the whole point of the job. CI
  # measures every documented platform; publish builds only the joined ones, and
  # that asymmetry is the mechanism by which a held platform can ever stop being
  # held. What licenses the write it feeds is native/targets.list's own header.
  #
  # **Nothing here cross-compiles.** Every leg's runner is that target's own
  # platform (native/runners.list), so `--target` names the host triple and
  # `rustup target add` is a no-op — native/targets.list refuses a cross-build
  # because it would publish an artifact no run has ever executed, and a producer
  # that cross-built would hand that same artifact to the smoke.
  native-artifacts-roster:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The declaration block's line grammar is owned by docs/site-architecture.md
      # §Generated projections and their freshness gates, and this awk is one of
      # its two readers — the other being the gate that holds the block and the
      # roster in lockstep. Same shape scripts/gates.list already ships: one
      # grammar with one owner, read from bash here and from the binary there.
      - name: derive the producer legs from the platform declaration
        id: legs
        run: |
          set -euo pipefail
          source gate-sdk/lib/gate.sh
          legs='[]'
          while IFS=$'\t' read -r target state; do
            case "$state" in
              joined) held=false ;;
              held:*) held=true ;;
              *)
                echo "platform '$target' declares state '$state', which is neither" >&2
                echo "'joined' nor 'held: <precondition>' — see docs/site-architecture.md." >&2
                exit 1
                ;;
            esac
            runner="$(gate_native_runner "$target")" || {
              echo "platform '$target' is declared on the install page with no runner" >&2
              echo "mapping — add one to $(gate_native_runners_file), or stop declaring it." >&2
              exit 1
            }
            legs="$(jq -c --arg t "$target" --arg r "$runner" --argjson h "$held" \
              '. + [{target: $t, runner: $r, held: $h}]' <<<"$legs")"
          done < <(awk '
            /^<!-- platforms:begin -->$/ { inb = 1; next }
            /^<!-- platforms:end -->$/   { inb = 0; next }
            inb && /^- `/ {
              if (!match($0, /`[^`]+`/)) next
              t = substr($0, RSTART + 1, RLENGTH - 2)
              rest = substr($0, RSTART + RLENGTH)
              s = ""
              if (match(rest, /^ \([^)]*\)/)) s = substr(rest, RSTART + 2, RLENGTH - 3)
              print t "\t" s
            }
          ' docs/install.md)
          if [ "$legs" = '[]' ]; then
            echo "the platform declaration resolved to no platform — the block is" >&2
            echo "absent or empty, and a producer with no leg measures nothing." >&2
            exit 1
          fi
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "producer legs: $legs"

  # **A joined leg is binding; a held leg is a measurement.** A red on a joined
  # platform fails this workflow, because the consumer smoke's default host
  # steering gave up the incidental assertion that the SHIPPED roster is packable
  # and this job is what replaces it — directly rather than by coincidence. A red
  # on a held platform is the reason that platform stays held, not a reason master
  # goes red: a held triple is on no roster, so nothing ships on its strength. It
  # is also where the runner label is likeliest to be stale, and an unmatched
  # label does not fail fast, it queues — hence the timeout beside it.
  native-artifacts:
    needs: native-artifacts-roster
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.native-artifacts-roster.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.held }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # `shell: bash` for the reason publish.yml's build leg states: this job's
      # `runs-on` is an expression, so no tree-local reader can state its runner,
      # and the day a Windows target is declared the default `run:` shell there is
      # pwsh. Stays a bash `run:` on the runner's preinstalled cargo (no
      # setup-rust action) to keep this workflow's checkout+bash tamper floor.
      - name: build the gate binary for ${{ matrix.target }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          source gate-sdk/lib/gate.sh
          crate="$(gate_native_crate)"
          binary="$(gate_native_bin)"
          binary="${binary##*/}"

          rustup target add "$TARGET"
          bash gate-sdk/bin/build-native.sh --target "$TARGET"

          # The one digest computation for this artifact anywhere in this run:
          # every later hop moves the file, so the digest the smoke verifies
          # against cannot diverge from the one produced beside the bytes. The
          # hasher is resolved rather than named, because stock macOS ships
          # `shasum` and not `sha256sum` and this job is the first build leg to
          # run off Linux; both spell the same `<hex>  <bare name>` sidecar that
          # `sha256sum -c` reads wherever a later reader puts the two files.
          out="$RUNNER_TEMP/artifact/$TARGET"
          mkdir -p "$out"
          cp "$crate/target/$TARGET/release/$binary" "$out/$binary"
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd "$out" && sha256sum "$binary" > "$binary.sha256" )
          else
            ( cd "$out" && shasum -a 256 "$binary" > "$binary.sha256" )
          fi
          echo "built $TARGET: $(cat "$out/$binary.sha256")"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Named for its target and carrying the target directory, so a
          # `pattern:` download lands exactly the layout pack-installer.sh reads
          # once the artifact-name prefix is stripped — the same naming
          # publish.yml's build leg uses, since the consumers are the same shape.
          name: gate-binary-${{ matrix.target }}
          path: ${{ runner.temp }}/artifact/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  # The macOS sibling, and the second non-Linux host this repository runs on.
  # **It is binding: its red fails this workflow.** Read that as a different
  # assertion from the Linux leg's rather than the same one spelled twice — the
  # Linux leg is binding through `--diff-baseline installer_smoke`, against a
  # recorded baseline, where this leg has no baseline and is binding on its own
  # exit status. Do not read this posture onto the WINDOWS sibling above, which is
  # still an instrument; the two legs are no longer the same shape.
  #
  # **The runner label floats, and read the honest limit with it.**
  # `macos-latest` matches `ubuntu-latest` and `windows-latest` beside it because
  # this leg's subject is the platform an adopter meets *today*, and a pinned
  # label would freeze this leg against a host adopters have already left.
  # The consequence is that `macos-latest` is **arm64**, so this leg measures
  # arm64 and nothing else. Do not read one green arm64 run as a macOS claim: an
  # Intel leg is a separate job this one neither buys nor blocks.
  #
  # **It no longer builds the artifact it exercises.** `needs: native-artifacts`
  # and the download below are what make this leg one half of the join predicate
  # native/targets.list's header states, rather than an adopter-path measurement
  # that licenses nothing: the bytes it installs are the release-shaped
  # producer's, moved and never re-derived.
  install-smoke-macos:
    needs: native-artifacts
    runs-on: macos-latest
    # Measured, not predicted: this leg took **20m12s** on run `34038127178`, over
    # a cold Homebrew install and a cold `cargo` build — which is exactly the case
    # this figure was widened for, so the measurement already covers the worst
    # start. The ~2.2x headroom left over it is deliberate now the leg is binding:
    # a timeout that reds `master` on runner variance costs more than a long leg,
    # so widen this before you narrow it. Do NOT copy the Windows leg's 90 — that
    # figure buys MSYS emulating `fork` on every one of this suite's thousands of
    # spawns, which macOS, whose spawns are native, does not pay.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 — the smoke stamps the packed version from `git describe
      # --tags`, for the reason the Linux leg above states.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # **Read this step as the assertion, not as scaffolding** — which is what
      # separates it from the Windows sibling's `choco install`. It performs
      # exactly the adopter action docs/install.md §Requirements documents for a
      # Mac: GNU bash, coreutils and gawk, `PATH`-ordered ahead of `/usr/bin`,
      # plus the `shellcheck` that same section sends a Mac to Homebrew for and
      # `init` refuses without. The whole value of this leg is that the documented
      # remedy stops being a reading and becomes a run, so a leg reaching green by
      # installing something the page does not name would be measuring a host no
      # adopter has.
      #
      # **Hold this package set and §Requirements' list equal, in both
      # directions.** In particular do not add `findutils`: the vendoring loop's
      # `-printf` was replaced in the same unit that landed this leg, so the
      # documented list is complete — and a leg that installed findutils anyway
      # would go green over an adopter path that stayed broken for everyone who
      # installed exactly what the page names. A divergence between this list and
      # that section is a defect in whichever of the two moved.
      #
      # It never fails: a brew that did not land is read off the probe below,
      # where it appears as the `<MISSING>` or the BSD flavour it actually is,
      # rather than truncating the job before the measurements.
      - name: install the GNU userland docs/install.md names, and PATH-order it
        run: |
          set +e
          brew install bash coreutils gawk shellcheck
          echo "brew exited $?"
          prefix="$(brew --prefix)"
          # gnubin carries the members under their unprefixed names, which is what
          # `PATH`-ordering means for a page that asks for `sort` and `awk` and not
          # for `gsort` and `gawk`.
          {
            echo "$prefix/opt/coreutils/libexec/gnubin"
            echo "$prefix/opt/gawk/libexec/gnubin"
            echo "$prefix/bin"
          } >> "$GITHUB_PATH"
          exit 0

      # Reporting only, and it never fails. It is what makes a red suite below
      # readable, which matters more now that the suite is binding: a suite dying
      # at its preflight says nothing about the host, and this says it all at once,
      # so read this step first when the leg goes red.
      #
      # It runs AFTER the install above deliberately: what it reports is then the
      # `PATH` an adopter who followed §Requirements actually has. Probing the
      # stock image instead would measure a host nobody following the page is on.
      # `BASH_VERSION` beside `command -v bash` is the check that the ordering
      # took — the stock interpreter is 3.2 and the floor is 4.3, so those two
      # disagreeing is itself the finding.
      - name: probe the runner
        run: |
          set +e
          echo "== interpreter =="
          echo "BASH_VERSION=$BASH_VERSION"
          echo "command -v bash: $(command -v bash)"
          uname -a
          sw_vers
          echo "== toolchain, by what PATH actually resolves =="
          for t in bash git jq awk gawk sed grep sort find realpath sha256sum \
                   shasum tar npm node cargo rustc rustup shellcheck ruby brew; do
            printf '%-11s %s\n' "$t" "$(command -v "$t" 2>/dev/null || echo '<MISSING>')"
          done
          echo "== flavours, against the GNU-first floor docs/install.md asserts =="
          for t in awk sed sort grep find tar; do
            printf '%-6s %s\n' "$t" "$("$t" --version 2>&1 | head -n1)"
          done
          echo "== the install path's own GNU-only constructs, probed not reasoned about =="
          printf '1.2.3\n1.10.0\n' | sort -V; echo "sort -V exited $?"
          realpath --relative-to=/ /usr/bin; echo "realpath --relative-to exited $?"
          # The construct this unit removed from installer/lib/init.sh, kept here
          # as the measurement that says whether removing it was necessary on this
          # host. A non-zero is the BSD refusal the fix was for; a zero means this
          # runner carries GNU findutils and the fix was owed to adopters rather
          # than to this leg.
          find . -maxdepth 1 -type f -printf '%P\n' >/dev/null 2>&1
          echo "find -printf exited $? (non-zero is the BSD refusal delta 3 removed)"
          echo "== rust =="
          rustc -vV
          echo "== git =="
          for k in core.autocrlf core.symlinks core.longpaths core.filemode; do
            printf '%-16s %s\n' "$k" "$(git config --get "$k" || echo '<unset>')"
          done
          echo "-- porcelain on a fresh checkout; empty is what every pack step demands --"
          git status --porcelain | head -n 40
          echo "== scratch =="
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "TMPDIR=${TMPDIR:-<unset>}"
          exit 0

      # Reporting only. The crate is where a non-Linux host fails first if it
      # fails at all, and a build that dies inside the suite makes every later
      # step's silence unreadable — so it is probed alone, before the suite that
      # depends on it, for the reason the Windows sibling states. The worktree is
      # re-read afterwards because a release build leaving mode churn is what
      # breaks the clean-tree precondition the pack step holds.
      - name: probe the crate build
        run: |
          set +e
          bash gate-sdk/bin/build-native.sh
          echo "build-native exited $?"
          ls -l native/target/release/ 2>&1 | head -n 20
          echo "-- porcelain after a release build; the smoke asserts this is empty --"
          git status --porcelain | head -n 40
          exit 0

      # The artifact this leg installs is the `native-artifacts` producer's, not
      # this host's. Downloaded by PATTERN rather than by name because a name
      # would have to spell this host's triple in the workflow, and a platform
      # literal in CI is a second spelling of the support commitment
      # native/targets.list is supposed to be the only surface for.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gate-binary-*
          path: ${{ runner.temp }}/native-artifacts

      # A `pattern:` download lands one directory per artifact name, so the
      # prefix comes off to leave `<artifacts>/<target>/` — the layout
      # pack-installer.sh reads and the one INSTALLER_SMOKE_ARTIFACTS_DIR is
      # specified against. Nothing is rehashed on the way: the sidecar that
      # arrives is the sidecar the producer emitted beside the bytes, which is
      # what keeps one producer per digest across this new hop.
      - name: normalize the producer's upload onto the layout pack reads
        run: |
          set -euo pipefail
          source gate-sdk/lib/gate.sh
          art="$RUNNER_TEMP/native-artifacts"
          binary="$(gate_native_bin)"; binary="${binary##*/}"
          host="$(rustc -vV | awk '/^host:/{print $2}')"
          [[ -n "$host" ]] || { echo "rustc reported no host triple"; exit 2; }
          for d in "$art"/gate-binary-*; do
            [[ -d "$d" ]] || continue
            mv "$d" "$art/${d##*/gate-binary-}"
          done
          ls -lR "$art"
          [[ -f "$art/$host/$binary" && -f "$art/$host/$binary.sha256" ]] || {
            echo "the producer uploaded no complete $host artifact — this leg"
            echo "exercises a release-shaped artifact and has none to exercise."
            exit 1
          }
          echo "SMOKE_ARTIFACTS=$art" >> "$GITHUB_ENV"

      # The suite itself, under one steering that is **measurement scaffolding and
      # not a fix**, exactly as the Windows sibling's is. It is a precondition
      # rather than a preference: `native/targets.list` carries one line,
      # `x86_64-unknown-linux-gnu`, and gate-sdk/SPEC.md §Consumer payload rules
      # that a consumer smoke building its artifact from the host it runs on
      # cannot satisfy a roster naming a platform that host is not. An unsteered
      # smoke here therefore fails on the roster before it reaches anything this
      # leg is measuring — a failure that looks exactly like the platform finding
      # this leg exists to collect.
      #
      # **A zero here licenses NO line in `native/targets.list`**, and the clause
      # is quoted here rather than left in the SPEC to be found. §Consumer payload
      # admits a triple only on a green run that PRODUCED AND EXERCISED its
      # artifact, and it goes on to rule that removing a blocker is not the
      # granting of a permission — naming this exact misreading, that an iteration
      # making a target *possible* invites its next reader to read the removal of
      # a blocker as the arrival of a permission. This leg is that iteration. The
      # discriminator is sharper still: the smoke builds its artifact **from the
      # host it runs on**, which §Consumer payload already classifies as a harness
      # stand-in and not that rule relaxing. So a green here proves the adopter
      # path works on macOS and proves nothing about a released macOS artifact,
      # because no released artifact was involved.
      - name: install smoke on a macOS host
        run: |
          set +e
          # The explicit steering below is now REDUNDANT with the smoke's own
          # default, which derives the same one-line roster when the caller sets
          # no knob (installer/README.md §The consumer smoke). It is kept rather
          # than dropped because it is the tree's one live witness for the
          # caller-override branch: the Linux leg exercises the default, this one
          # exercises the override, and neither path is then reached only in a
          # fixture.
          host="$(rustc -vV | awk '/^host:/{print $2}')"
          [[ -n "$host" ]] \
            || { echo "rustc reported no host triple, so the roster cannot be steered"; exit 2; }
          echo "host triple: $host"
          roster="$RUNNER_TEMP/targets.list"
          printf '%s\n' "$host" > "$roster"
          log="$RUNNER_TEMP/installer-smoke-macos.log"
          GATE_SDK_NATIVE_TARGETS_FILE="$roster" INSTALLER_SMOKE_TMP_DIR="$RUNNER_TEMP" \
            INSTALLER_SMOKE_ARTIFACTS_DIR="$SMOKE_ARTIFACTS" \
            bash installer/consumer-smoke/run-smoke.sh 2>&1 | tee "$log"
          rc="${PIPESTATUS[0]}"
          echo "== verdict =="
          echo "installer_smoke on macOS exited $rc"
          echo "This leg is binding: a non-zero here fails the workflow."
          echo "A zero here is not a roster join: see this step's header for why."
          exit "$rc"
