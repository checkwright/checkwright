# Scheduled probe of the live docs site — monitoring, NOT a gate. It verifies a
# deployment, not a tree, so it reds on causes no commit produced (DNS, a Pages
# incident, a stalled cert renewal), breaking both the low-false-positive gate
# contract and the CI backstop's checkout+bash hermeticity — see
# gate-sdk/SPEC.md §Enforcement tiers. It therefore lives beside your gates
# workflow, never inside it: a failed probe opens (or updates, never duplicates)
# a site-health issue and reds this run, never a merge. Recovery self-clears (a
# green run closes the open issue). No README badge, by the standing ruling.
#
# Copy verbatim into .github/workflows/, then set two groups of env below or
# delete the arm each belongs to: ALT_DOMAIN (drop probe #4 if you serve no
# redirect alias), and the three RELEASE_NOTE_* knobs (drop probe #6 if you
# publish no release notes). The apex host is read from the CNAME file — no
# second place to keep it.
# enforce: class=monitor live docs-site deployment — apex/www/http HTTPS, redirects, cert expiry, and release-body note pointers
name: site-health

on:
  schedule:
    - cron: '17 6 * * *'   # daily, off the hour to dodge cron congestion
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Inject a synthetic probe failure to exercise the issue path'
        type: boolean
        default: false

# A permissions: block is an allowlist, not an addition — every scope it omits is
# none. issues:write carries the open/update/close path; contents:read is what
# lets the probe read the tag list and the Release bodies. Without it those reads
# 404, which reads like "no such Release" rather than "not permitted".
permissions:
  issues: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # The CNAME file is the single source of truth for the apex host; reading
      # it here gives the monitor a cutover for free.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: probe live site
        id: probe
        env:
          # Alternate redirect host — a bare public hostname, never a URL
          # literal (a docs-cname-parity gate bars the alias in ://url form);
          # the probe builds the URL from this at run time. Set to your redirect
          # alias, or delete this env and probe #4 below if you have none.
          ALT_DOMAIN: alt.example.com
          # Release-note pointer arm (#6) — set all three, or delete them along
          # with probe #6 below. Step-level workflow env, not the kit's SITE_KIT_*
          # knobs: this file is copied and edited, never sourced, so it must not
          # reach into a vendored gates dir. The host is deliberately absent —
          # the CNAME file stays its single source, so a rename is one edit.
          RELEASE_NOTE_GLOB: 'docs/posts/*.md'
          RELEASE_NOTE_TAG_KEY: 'release'
          # Path only; {slug} is the note filename minus its extension. Check the
          # form your host actually serves — a generator that emits
          # /posts/<slug>.html often serves the extensionless form too, and the
          # value must match what your release bodies are written to carry.
          RELEASE_NOTE_URL_PATH: '/posts/{slug}'
          FORCE_FAIL: ${{ inputs.force_fail }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A probe expects individual checks to fail; -e would abort the battery
          # on the first red, so disable it and collect failures explicitly.
          set +e
          set -uo pipefail

          apex="$(tr -d '[:space:]' < docs/CNAME)"
          if [ -z "$apex" ]; then
            echo "docs/CNAME empty — cannot resolve apex host"
            exit 1
          fi
          echo "apex host: $apex"

          failures=()

          # 1. apex answers 200 over HTTPS; curl validates the cert at handshake,
          #    so a TLS fault also reds here.
          code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "https://$apex/")"
          [ "$code" = 200 ] || failures+=("apex https did not answer 200 (got '$code')")

          # 2. www 301s to the apex.
          read -r code loc < <(curl -sS -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' "https://www.$apex/") || true
          case "${code}::${loc}" in
            301::*"//$apex/"*) ;;
            *) failures+=("www did not 301 to apex (got '$code' -> '$loc')") ;;
          esac

          # 3. http:// 301s to https:// — proves Enforce-HTTPS has not silently flipped.
          read -r code loc < <(curl -sS -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' "http://$apex/") || true
          case "${code}::${loc}" in
            301::https://*) ;;
            *) failures+=("http did not 301 to https (got '$code' -> '$loc')") ;;
          esac

          # 4. the alternate host 301s to the apex, request path kept. Delete this
          #    block along with ALT_DOMAIN above if you serve no redirect alias.
          read -r code loc < <(curl -sS -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' "https://$ALT_DOMAIN/install.html") || true
          case "${code}::${loc}" in
            301::*"//$apex/install.html"*) ;;
            *) failures+=("$ALT_DOMAIN did not 301 to apex keeping path (got '$code' -> '$loc')") ;;
          esac

          # 5. certificate expiry >= 14 days — the real payload. Pages renews ~30d
          #    out, so inside 14 days means renewal has silently stalled. curl -v
          #    prints the handshake's "expire date:", keeping this curl-only.
          expire="$(curl -sSv -m 20 "https://$apex/" 2>&1 >/dev/null | sed -n 's/^\* *expire date: //p' | head -1)"
          if [ -z "$expire" ]; then
            failures+=("could not read certificate expiry for $apex")
          else
            exp_epoch="$(date -d "$expire" +%s 2>/dev/null)"
            if [ -z "$exp_epoch" ]; then
              failures+=("unparseable certificate expiry for $apex: '$expire'")
            else
              days=$(( (exp_epoch - $(date +%s)) / 86400 ))
              [ "$days" -ge 14 ] || failures+=("certificate for $apex expires in $days day(s) (< 14): $expire")
            fi
          fi

          # 6. every tracked release note naming an existing tag has a Release
          #    whose body points at that note, and every apex URL that body
          #    carries resolves. The two assertions run over two different
          #    strings — presence over the URL derived here, resolution over the
          #    URLs the body actually carries — and collapsing them re-opens the
          #    defects this arm exists for (site-kit/SPEC.md §templates/site-health.yml).
          #    Delete this whole block along with the RELEASE_NOTE_* env above if
          #    you publish no release notes.
          notes=()
          shopt -s nullglob
          for f in $RELEASE_NOTE_GLOB; do
            notes+=("$f")
          done
          shopt -u nullglob
          if [ "${#notes[@]}" -eq 0 ]; then
            failures+=("release-note glob matched nothing: '$RELEASE_NOTE_GLOB' — set the RELEASE_NOTE_* env above, or delete this arm")
          fi

          # The tag list comes from the API, never `git tag`: checkout fetches no
          # tags at depth 1, so a git-driven arm finds zero released notes and
          # reads green forever. --paginate concatenates the pages' arrays, so
          # count by streaming the names — --jq 'length' returns the last page's
          # count, which understates exactly once pagination starts to matter.
          tag_err="$(mktemp)"
          tags="$(gh api --paginate 'repos/{owner}/{repo}/tags' --jq '.[].name' 2>"$tag_err")"
          tag_rc=$?
          if [ "$tag_rc" -ne 0 ]; then
            # Asserted on the call's own exit status, never inferred from the
            # count below: this step runs under `set +e`, so a failed call yields
            # an empty tag list and a zero exit, every note then reads "not yet
            # released", and the arm reports a clean run forever.
            failures+=("could not read the tag list (gh exit $tag_rc): $(tr '\n' ' ' < "$tag_err")")
            tags=""
          fi
          rm -f "$tag_err"
          n_tags="$(grep -c . <<<"$tags")"

          n_found="${#notes[@]}"; n_keyed=0; n_released=0; n_checked=0
          for f in "${notes[@]:-}"; do
            [ -n "$f" ] || continue
            # Anchored inside the opening front-matter fence. A bare ^key: match
            # also hits the body.
            tag="$(awk -v key="$RELEASE_NOTE_TAG_KEY" '
              /^---[[:space:]]*$/ { fm++; next }
              fm == 1 && index($0, key ":") == 1 {
                v = substr($0, length(key) + 2); sub(/^[[:space:]]+/, "", v); print v; exit
              }' "$f")"
            # A post carrying no tag key is not a release note. Silent by ruling:
            # the census line below is how that case stays readable.
            [ -n "$tag" ] || continue
            n_keyed=$(( n_keyed + 1 ))
            # A note whose tag is not on the remote is a legitimate skip — its
            # release is deferred. This is why the tag list is not replaceable by
            # the per-tag lookup below: a 404 there cannot tell that apart from a
            # tag whose Release is genuinely missing.
            grep -Fxq -- "$tag" <<<"$tags" || continue
            n_released=$(( n_released + 1 ))

            slug="${f##*/}"; slug="${slug%.*}"
            want="https://$apex${RELEASE_NOTE_URL_PATH//\{slug\}/$slug}"

            rel_err="$(mktemp)"
            body="$(gh api "repos/{owner}/{repo}/releases/tags/$tag" --jq '.body // ""' 2>"$rel_err")"
            rel_rc=$?
            if [ "$rel_rc" -ne 0 ]; then
              failures+=("$tag: no readable Release for a tag that exists (gh exit $rel_rc): $(tr '\n' ' ' < "$rel_err")")
              rm -f "$rel_err"
              continue
            fi
            rm -f "$rel_err"
            n_checked=$(( n_checked + 1 ))

            # Presence: containment, never equality — an older body may write a
            # suffixed variant of its URL. Scheme-qualified, because a markdown
            # link's visible label often repeats the URL scheme-less and would
            # satisfy a scheme-less match while the link target went unchecked.
            case "$body" in
              *"$want"*) ;;
              *) failures+=("$tag: Release body does not carry the note URL $want") ;;
            esac

            # Resolution: every apex URL as literally written in the body — this
            # is what catches a trailing-slash URL that presence's containment
            # lets through. Scheme-anchored so a label is never mistaken for a
            # target. The trailing punctuation that occurs in practice is
            # markdown-structural, `)` closing a link target and `)**` closing
            # one inside bold, so the set covers `)` and `*` and strips a run.
            # Deliberately not filtered to note URLs: a body's other apex links
            # are covered too.
            while read -r u; do
              [ -n "$u" ] || continue
              case "$u" in
                "https://$apex"|"https://$apex/"*|"http://$apex"|"http://$apex/"*) ;;
                *) continue ;;
              esac
              code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$u")"
              [ "$code" = 200 ] || failures+=("$tag: Release body URL $u did not answer 200 (got '$code')")
            done < <(grep -oE 'https?://[^[:space:]<>"]+' <<<"$body" | sed -E 's/[).,;:!?*]+$//' | sort -u)
          done

          # Which zero-case a reader is in. A diagnostic, not an assertion — the
          # rulings above are what make a vacuous pass impossible.
          echo "release-body: $n_found note(s) found, $n_keyed keyed '$RELEASE_NOTE_TAG_KEY:', $n_released released of $n_tags remote tag(s), $n_checked checked"

          # DoD hook: a workflow_dispatch with force_fail=true exercises the issue
          # path on demand without waiting for a real outage.
          if [ "$FORCE_FAIL" = true ]; then
            failures+=("synthetic failure (force_fail dispatch input)")
          fi

          if [ "${#failures[@]}" -gt 0 ]; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
            {
              echo "report<<PROBE_EOF"
              printf '%s\n' "${failures[@]}"
              echo "PROBE_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "FAILED probe(s):"
            printf '  - %s\n' "${failures[@]}"
          else
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "all probes green"
          fi

      - name: file or clear the site-health issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.probe.outputs.status }}
          REPORT: ${{ steps.probe.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label=site-health
          # Idempotent: creates the label on first use, no-ops once it exists.
          gh label create "$label" --color b60205 \
            --description "Live-site monitoring probe failure" 2>/dev/null || true

          open_num="$(gh issue list --label "$label" --state open \
            --json number --jq '.[0].number // empty')"
          now="$(date -u +'%Y-%m-%d %H:%MZ')"

          if [ "$STATUS" = fail ]; then
            body="$(printf 'Automated site-health probe failed on %s.\n\nFailed probe(s):\n\n```\n%s\n```\n\nRun log: %s\n' \
              "$now" "$REPORT" "$RUN_URL")"
            if [ -n "$open_num" ]; then
              echo "updating open site-health issue #$open_num"
              gh issue comment "$open_num" --body "$body"
            else
              echo "opening a site-health issue"
              gh issue create --label "$label" \
                --title "Site health: live-site probe failed" --body "$body"
            fi
            # Red this run as the operator's second signal (reds no merge).
            exit 1
          fi

          if [ -n "$open_num" ]; then
            echo "recovery: closing site-health issue #$open_num"
            gh issue close "$open_num" \
              --comment "Recovered: all probes green on $now. Run log: $RUN_URL"
          else
            echo "site healthy; no open issue to clear"
          fi
